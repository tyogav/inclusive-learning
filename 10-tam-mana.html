<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>மனப்பாடச் செய்யுள் பயிற்சி</title>
<style>
body{font-family:"Noto Sans Tamil",system-ui,sans-serif;max-width:640px;margin:auto;padding:16px;font-size:20px;line-height:1.8;background:#fbfaf7;color:#222}
h1{font-size:1.3em}
.btn{font:inherit;padding:8px 14px;margin:4px;border:1px solid #888;border-radius:8px;background:#fff;cursor:pointer}
.btn.on{background:#2d6a4f;color:#fff;border-color:#2d6a4f}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0002}
input.blank{font:inherit;width:6em;padding:2px 6px;border:none;border-bottom:2px solid #2d6a4f;background:transparent;text-align:center}
input.bad{border-bottom-color:#c1121f}
.ok{color:#2d6a4f;font-weight:bold}.no{color:#c1121f}
.chip{display:inline-block;padding:8px 12px;margin:4px;border:1px solid #2d6a4f;border-radius:8px;cursor:pointer;background:#fff}
.chip.used{opacity:.3;pointer-events:none}
.hint{font-size:.85em;color:#666}
select,textarea{font:inherit;max-width:100%}
</style>
</head>
<body>
<h1>மனப்பாடச் செய்யுள் பயிற்சி</h1>
<select id="poemSel"></select>
<div>
  <button class="btn on" data-m="blank">வார்த்தை நிரப்பு</button>
  <button class="btn" data-m="order">வரிசைப்படுத்து</button>
  <button class="btn" data-m="speak">பேசிச் சொல்</button>
</div>
<div id="nav"></div>
<div id="app"></div>

<script>
// ---- Settings ----
const THRESH = 0.7;   // lower = more forgiving (0.6 very forgiving, 0.8 strict)

// ---- Content: from Class 10 Tamil மனப்பாடப் பாடல்கள் (செ.பாலமுருகன்). Verify against the printed book. ----
const POEMS = [
  {title:"அன்னை மொழியே — பாவலரேறு பெருஞ்சித்திரனார்", lines:[
    "அன்னை மொழியே! அழகார்ந்த செந்தமிழே!",
    "முன்னைக்கும் முன்னை முகிழ்த்த நறுங்கனியே!",
    "கன்னிக் குமரிக் கடல்கொண்ட நாட்டிடையில்",
    "மன்னி அரசிருந்த மண்ணுலகப் பேரரசே!",
    "தென்னன் மகளே! திருக்குறளின் மாண்புகழே!",
    "இன்னறும் பாப்பத்தே! எண்தொகையே! நற்கணக்கே!",
    "மன்னுஞ் சிலம்பே! மணிமே கலைவடிவே!",
    "முன்னும் நினைவால் முடிதாழ வாழ்த்துவமே!"]},
  {title:"காலக்கணிதம் — கண்ணதாசன்", lines:[
    "மாற்றம் எனது மானிடத் தத்துவம்;",
    "மாறும் உலகின் மகத்துவம் அறிவேன்!",
    "எவ்வெவை தீமை எவ்வெவை நன்மை",
    "என்ப தறிந்து ஏகுமென் சாலை!",
    "தலைவர் மாறுவர்; தர்பார் மாறும்;",
    "தத்துவம் மட்டுமே அட்சய பாத்திரம்!",
    "கொள்வோர் கொள்க; குரைப்போர் குரைக்க!",
    "உள்வாய் வார்த்தை உடம்பு தொடாது;",
    "நானே தொடக்கம்; நானே முடிவு;",
    "நானுரைப் பதுதான் நாட்டின் சட்டம்!"]},
  {title:"காசிக்காண்டம் — அதிவீரராம பாண்டியர்", lines:[
    "விருந்தினனாக ஒருவன் வந்து எதிரின்",
    "வியத்தல் நன்மொழி இனிது உரைத்தல்",
    "திருந்துற நோக்கல் வருக என உரைத்தல்",
    "எழுதல் முன் மகிழ்வன செப்பல்",
    "பொருந்து மற்றுஅவன் தன்அருகுற இருத்தல்",
    "போமெனில் பின் செல்வதாதல்",
    "பரிந்துநன் முகமன் வழங்கல் இவ்வொன்பான்",
    "ஒழுக்கமும் வழிபடும் பண்பே."]},
  {title:"திருக்குறள் 1–5 (இயல் 2)", lines:[
    "எப்பொருள் எத்தன்மைத் தாயினும் அப்பொருள்",
    "மெய்ப்பொருள் காண்ப தறிவு.",
    "பல்லார் பகைகொளலின் பத்தடுத்த தீமைத்தே",
    "நல்லார் தொடர்கை விடல்.",
    "பண்என்னாம் பாடற் கியையபின்றேல்; கண்என்னாம்",
    "கண்ணோட்டம் இல்லாத கண்.",
    "அருமை உடைத்தென் றசாவாமை வேண்டும்",
    "பெருமை முயற்சி தரும்.",
    "முயற்சி திருவினை ஆக்கும் முயற்றின்மை",
    "இன்மை புகுத்தி விடும்."]},
  {title:"திருவிளையாடற்புராணம் — பரஞ்சோதி முனிவர்", lines:[
    "புண்ணியப் புலவீர் யான் இப்போழ்து இடைக் காடனார்க்குப்",
    "பண்ணிய குற்றம் எல்லாம் பொறுக்க எனப் பரவித் தாழ்ந்தான்",
    "நுண்ணிய கேள்வி யோரும் மன்னநீ நுவன்ற சொல்லாம்",
    "தண்ணிய அமுதால் எங்கள் கோபத்தீத் தணிந்தது என்னா."]},
  {title:"கம்பராமாயணம் — கம்பர்", lines:[
    "தண்டலை மயில்கள் ஆடத் தாமரை விளக்கம் தாங்கக்",
    "கொண்டல்கள் முழவின் ஏங்கக் குவளைகண் விழித்து நோக்கத்",
    "தெண்டிரை எழினி காட்டத் தேம்பிழி மகர யாழின்",
    "வண்டுகள் இனிது பாட மருதம்வீற் றிருக்கும் மாதோ.",
    "வெய்யோன்ஒளி தன்மேனியின் விரிசோதியின் மறையப்",
    "பொய்யோஎனும் இடையாளொடும் இளையாளொடும் போனான்",
    "மையோமரகதமோ மறிகடலோ மழைமுகிலோ",
    "ஐயோஇவன் வடிவென்பதோர் அழியா அழகுடையான்."]},
  {title:"திருக்குறள் 1–5 (இயல் 5)", lines:[
    "செயற்கை அறிந்தக் கடைத்தும் உலகத்",
    "இயற்கை அறிந்து செயல்.",
    "பொருளல் லவரைப் பொருளாகச் செய்யும்",
    "பொருளல்ல தில்லை பொருள்.",
    "குன்றேறி யானைப்போர் கண்டற்றால் தன்கைத்தொன்",
    "றுண்டாகச் செய்வான் வினை.",
    "குற்றம் இலனாய்க் குடிசெய்து வாழ்வானைச்",
    "சுற்றமாச் சுற்றும் உலகு.",
    "இன்மையின் இன்னாத தியாதெனின் இன்மையே",
    "இன்னா தது."]},
  {title:"சிலப்பதிகாரம் — இளங்கோவடிகள்", lines:[
    "தூசும் துகிரும் ஆரமும் அகிலும்",
    "மாசறு முத்தும் மணியும் பொன்னும்",
    "அருங்கலம் வெறுக்கையோடு அளந்துகடை அறியா",
    "வளந்தலை மயங்கிய நனந்தலை மறுகும்;",
    "பால்வகை தெரிந்த பகுதிப் பண்டமொடு",
    "கூலம் குவித்த கூல வீதியும்;"]},
  {title:"முத்தொள்ளாயிரம்", lines:[
    "அள்ளல் பழனத்து அரக்காம்பல் வாயவிழ",
    "வெள்ளம்தீப் பட்டது எனவெரீஇப் புள்ளினம்",
    "கைச்சிறகால் பார்ப்பொடுக்கும் கவ்வை உடைத்தரோ",
    "நச்சிலைவேல் கோக்கோதை நாடு."]},
  {title:"தேம்பாவணி — வீரமாமுனிவர்", lines:[
    "நவமணி வடக்க யில்போல்",
    "நல்லறப் படலைப் பூட்டும்",
    "தவமணி மார்பன் சொன்ன",
    "தன்னிசைக்கு இசைகள் பாடத்",
    "துவமணி மரங்கள் தோறும்",
    "துணர்அணிச் சுனைகள் தோறும்",
    "உவமணி கானம்கொல் என்று",
    "ஒலித்து அழுவ போன்றே."]},
  {title:"சொந்த உரை (நீங்களே ஒட்டவும்)", lines:[]}
];

// ---- State ----
let P=0, U=0, L=1, M='blank', unit=[];
let S={k:0,t:0,seq:[]};
const $ = s => document.querySelector(s);
const app = $('#app');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

// ---- Matching (forgiving) ----
function norm(s){
  return s.normalize('NFC')
    .replace(/[\s\u200c\u200d.,;:!?'"“”‘’\-()\[\]\u0964\u0965]/g,'')
    .toLowerCase();
}
function lev(a,b){
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[b.length];
}
function similar(a,b){
  const x=norm(a), y=norm(b);
  if(!x||!y) return 0;
  return 1 - lev(x,y)/Math.max(x.length,y.length);
}

// ---- Helpers ----
function groups(){
  const g=[], ls=POEMS[P].lines;
  for(let i=0;i<ls.length;i+=4) g.push(ls.slice(i,i+4));
  return g;
}
function listen(cb){
  if(!SR){ cb(null); return; }
  const r=new SR();
  r.lang='ta-IN'; r.maxAlternatives=5;
  r.onresult=e=>cb([...e.results[0]].map(a=>a.transcript));
  r.onerror=()=>cb([]);
  r.start();
}

// ---- Setup ----
const sel=$('#poemSel');
POEMS.forEach((p,i)=>sel.add(new Option(p.title,i)));
sel.onchange=()=>{P=+sel.value;U=0;S={k:0,t:0,seq:[]};render();};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
  M=b.dataset.m; U=0; S={k:0,t:0,seq:[]};
  document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));
  render();
});

// ---- Navigation ----
function go(d){
  const n=groups().length; U=(U+d+n)%n; S={k:0,t:0,seq:[]}; render();
}

// ---- Main render ----
function render(){
  if(!POEMS[P].lines.length){ renderCustom(); return; }
  const g=groups(); if(U>=g.length) U=0;
  unit=g[U];
  $('#nav').innerHTML=`<div class="hint">பகுதி ${U+1}/${g.length}
    <button class="btn" onclick="go(-1)">◀</button><button class="btn" onclick="go(1)">▶</button>
    ${M==='blank'?[1,2,3].map(l=>`<button class="btn ${l===L?'on':''}" onclick="L=${l};render()">நிலை ${l}</button>`).join(''):''}
  </div>`;
  if(M==='blank') renderBlank();
  else if(M==='order') renderOrder();
  else renderSpeak();
}

function renderCustom(){
  $('#nav').innerHTML='';
  app.innerHTML=`<div class="card">
    <p>பாடல் வரிகளை ஒவ்வொரு வரியாக எழுதவும் (ஒரு வரி, ஒரு நிரை):</p>
    <textarea id="ct" rows="10" style="width:100%"></textarea>
    <div><button class="btn" onclick="saveCustom()">சேமி</button></div></div>`;
}
function saveCustom(){
  POEMS[P].lines=$('#ct').value.split('\n').map(s=>s.trim()).filter(Boolean);
  render();
}

// ---- Mode 1: fill the blanks ----
function renderBlank(){
  const every=[4,3,2][L-1];
  let h='<div class="card">';
  unit.forEach(line=>{
    const ws=line.split(' ');
    const bl=ws.map((_,i)=>i%every===every-1);
    if(!bl.includes(true)) bl[ws.length-1]=true;
    h+='<div>'+ws.map((w,i)=>bl[i]
      ?`<input class="blank" data-a="${w}" size="${w.length}">`:w).join(' ')+'</div>';
  });
  h+='<div><button class="btn" onclick="checkBlank()">சரிபார்</button></div><div id="res" class="hint"></div></div>';
  app.innerHTML=h;
}
function checkBlank(){
  let ok=0, inputs=document.querySelectorAll('input.blank');
  inputs.forEach(inp=>{
    if(inp.disabled) return;
    if(similar(inp.value,inp.dataset.a)>=THRESH){
      ok++; inp.disabled=true; inp.style.color='#2d6a4f'; inp.classList.remove('bad');
    } else {
      inp.classList.add('bad'); inp.value=''; inp.placeholder=inp.dataset.a;
    }
  });
  const done=[...inputs].every(i=>i.disabled);
  $('#res').innerHTML = done
    ? '<span class="ok">எல்லாம் சரி! 🎉</span>'
    : `<span class="no">${ok} சரி. தவறானவற்றில் சரியான சொல் காட்டப்பட்டுள்ளது.</span>`;
}

// ---- Mode 2: put lines in order ----
function renderOrder(){
  S.seq=[];
  const idx=unit.map((_,i)=>i).sort(()=>Math.random()-0.5);
  app.innerHTML=`<div class="card">
    <div id="seq"></div>
    <div id="pool">${idx.map(i=>`<span class="chip" data-i="${i}">${unit[i]}</span>`).join('')}</div>
    <div id="res" class="hint"></div>
    <button class="btn" onclick="render()">மீண்டும் கலக்கு</button></div>`;
  document.querySelectorAll('#pool .chip').forEach(c=>c.onclick=()=>{
    const i=+c.dataset.i;
    if(i===S.seq.length){
      S.seq.push(i); c.classList.add('used');
      $('#seq').innerHTML=S.seq.map(j=>`<div>${unit[j]}</div>`).join('');
      $('#res').innerHTML = S.seq.length===unit.length
        ? '<span class="ok">சரி! முழுப் பகுதியும் வரிசையாக வந்தது 🎉</span>' : '';
    } else {
      $('#res').innerHTML='<span class="no">அடுத்த வரி இதுவல்ல, மீண்டும் முயலுங்கள்</span>';
    }
  });
}

// ---- Mode 3: say the next line ----
function renderSpeak(){
  if(S.k>=unit.length){
    app.innerHTML=`<div class="card ok">இந்தப் பகுதி முடிந்தது! 🎉</div>
      <button class="btn" onclick="S.k=0;render()">மீண்டும்</button>`;
    return;
  }
  const ctx = S.k ? unit[S.k-1] : '(முதல் வரி — நீங்களே தொடங்குங்கள்)';
  app.innerHTML=`<div class="card">
    <div class="hint">முந்தைய வரி:</div><div>${ctx}</div>
    <div class="hint" style="margin-top:12px">அடுத்த வரியைச் சொல்லுங்கள்</div>
    <button class="btn" id="mic">🎤 பேசு</button>
    <div id="res"></div>
    <button class="btn" onclick="showAns()">பதில் காட்டு</button></div>`;
  $('#mic').onclick=()=>{
    $('#res').textContent='கேட்கிறது...';
    listen(alts=>{
      if(alts===null){ $('#res').innerHTML='<span class="no">இந்த உலாவியில் குரல் வசதி இல்லை. Chrome பயன்படுத்தவும்.</span>'; return; }
      if(alts.some(a=>similar(a,unit[S.k])>=THRESH)){
        $('#res').innerHTML='<span class="ok">சரி ✓</span>';
        S.k++; S.t=0; setTimeout(render,900);
      } else {
        S.t++;
        $('#res').innerHTML=`<span class="no">மீண்டும் முயலுங்கள்</span>`+
          (alts[0]?`<div class="hint">கேட்டது: ${alts[0]}</div>`:'');
        if(S.t>=3) showAns();
      }
    });
  };
}
function showAns(){
  $('#res').innerHTML=`<div class="card">${unit[S.k]}</div>
    <button class="btn" onclick="S.k++;S.t=0;render()">அடுத்தது</button>`;
}

// ---- Start ----
render();
</script>
</body>
</html>
