<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TYM Class 10 English — One-Mark Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2937;
  --paper:#faf7f1;
  --paper-deep:#f0ead9;
  --indigo:#2c3a6b;
  --indigo-deep:#1c2749;
  --marigold:#d98c2b;
  --marigold-soft:#f3dcb0;
  --leaf:#3c7a5e;
  --leaf-soft:#dcefe3;
  --rose:#b5495b;
  --rose-soft:#f8dde1;
  --sky:#2563eb;
  --sky-soft:#e0ecff;
  --line:#d8d0bd;
  --exam-paper:#fdfbf6;
  box-sizing:border-box;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;
}
.tamil{font-family:'Noto Sans Tamil',sans-serif;}
h1,h2,h3,.serif{font-family:'Lora',serif;}
.app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* Topbar */
.topbar{
  background:var(--indigo);
  color:#fff;
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.topbar .brand{font-family:'Lora',serif;font-weight:600;font-size:1.02rem;display:flex;align-items:center;gap:8px;}
.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--marigold);}
.topbar .student{font-size:.82rem;opacity:.92;display:flex;align-items:center;gap:8px;}
.topbar button.back{
  background:rgba(255,255,255,.14);border:none;color:#fff;font-size:.95rem;line-height:1;
  cursor:pointer;padding:7px 11px;border-radius:8px;font-weight:600;
}
.topbar button.back:active{background:rgba(255,255,255,.25);}
.topbar button.about-btn{
  background:rgba(255,255,255,.14);border:none;color:#fff;font-size:1rem;line-height:1;
  cursor:pointer;width:30px;height:30px;border-radius:50%;font-weight:600;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;padding:0;
}

.about-overlay{
  position:fixed;inset:0;background:rgba(28,39,73,.55);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
}
.about-modal{
  background:#fff;border-radius:16px;padding:26px 22px;max-width:440px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center;margin:auto;
}
.about-modal h2{color:var(--indigo-deep);font-size:1.15rem;margin-bottom:10px;}
.about-modal .about-desc{font-size:.85rem;color:#575144;line-height:1.5;margin-bottom:12px;text-align:left;}
.about-modal .about-section-label{font-size:.68rem;color:#8a8373;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;text-align:left;}
.about-modal .about-source{font-size:.82rem;color:#575144;line-height:1.45;text-align:left;margin-bottom:14px;}
.about-modal .credit-card{display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:14px;}
.about-modal .credit-avatar{
  width:40px;height:40px;border-radius:50%;background:var(--indigo);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:'Lora',serif;font-weight:700;font-size:.95rem;
}
.about-modal .credit-name{font-family:'Lora',serif;font-weight:700;font-size:.98rem;color:var(--indigo);}
.about-modal .credit-role{font-size:.78rem;color:#575144;margin-top:1px;}
.about-modal .credit-school{font-size:.76rem;color:#8a8373;line-height:1.35;margin-top:1px;}
.about-modal .about-caution{
  background:var(--paper-deep);border-radius:8px;
  padding:8px 11px;font-size:.74rem;color:#6b6456;line-height:1.4;text-align:left;margin-bottom:16px;
}
.about-modal button.close-about{
  background:var(--indigo);color:#fff;border:none;border-radius:10px;padding:11px 20px;
  font-weight:600;font-size:.92rem;cursor:pointer;width:100%;min-height:44px;
}

main{flex:1;padding:20px 18px 90px;}
.screen{animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

/* Onboarding */
.onboard-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 22px;margin-top:6vh;
  box-shadow:0 10px 30px rgba(44,58,107,.08);
}
.onboard-card h1{font-size:1.48rem;color:var(--indigo-deep);margin-bottom:6px;}
.onboard-card p.sub{color:#6b6456;font-size:.92rem;margin-bottom:20px;line-height:1.5;}
.onboard-card label{display:block;font-size:.85rem;color:#6b6456;margin-bottom:6px;font-weight:600;}
.onboard-card input[type=text]{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;
  font-family:'Inter',sans-serif;background:var(--paper);
}
.onboard-card input[type=text]:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}
.btn-primary{
  margin-top:18px;width:100%;background:var(--indigo);color:#fff;border:none;border-radius:10px;
  padding:14px;font-size:1rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;min-height:48px;
}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}

/* Greeting & Collapsible Easy Support Drawer */
.greet{margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.greet h1{font-size:1.35rem;color:var(--indigo-deep);}
.greet p{color:#6b6456;font-size:.88rem;margin-top:3px;}
.small-outline-btn{
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;
  font-size:.76rem;color:#6b6456;cursor:pointer;font-weight:600;
}

.drawer-card{
  background:#fff;border:1.5px solid var(--line);border-radius:12px;
  margin-bottom:14px;overflow:hidden;
}
.drawer-header{
  width:100%;background:#fff;border:none;padding:11px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  cursor:pointer;text-align:left;min-height:46px;
}
.drawer-header:hover{background:var(--paper);}
.drawer-summary{display:flex;flex-direction:column;gap:2px;}
.drawer-title{font-size:.82rem;font-weight:700;color:var(--indigo-deep);display:flex;align-items:center;gap:6px;}
.drawer-sub{font-size:.74rem;color:#6b6456;}
.drawer-chevron{
  font-size:.76rem;font-weight:700;color:var(--indigo);background:var(--paper-deep);
  padding:4px 10px;border-radius:999px;white-space:nowrap;
}
.drawer-body{
  display:none;padding:12px 14px 14px;border-top:1px solid var(--line);background:var(--paper);
}
.drawer-body.open{display:block;}
.toggle-grid{display:grid;grid-template-columns:1fr;gap:8px;}
@media(min-width:540px){.toggle-grid{grid-template-columns:1fr 1fr;}}
.pill-toggle{
  border:1.5px solid var(--line);background:#fff;color:#575144;border-radius:10px;
  padding:9px 11px;font-size:.78rem;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
}
.pill-toggle .pt-top{display:flex;justify-content:space-between;width:100%;align-items:center;font-weight:700;}
.pill-toggle .pt-desc{font-size:.7rem;font-weight:400;color:#6b6456;}
.pill-toggle.on{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf);}
.pill-toggle.on .pt-desc{color:#2c5e47;}
.pill-toggle.pron.on{background:var(--sky-soft);border-color:var(--sky);color:#1e40af;}
.pill-toggle.pron.on .pt-desc{color:#1e3a8a;}

/* Filter Bar for Ordered Topics */
.filter-bar{
  display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;
}
.filter-chip{
  border:1.5px solid var(--line);background:#fff;color:#575144;border-radius:999px;
  padding:6px 12px;font-size:.76rem;font-weight:600;cursor:pointer;white-space:nowrap;
}
.filter-chip.active{background:var(--indigo);border-color:var(--indigo);color:#fff;}

/* Category Grid (Strict Sequential Order 1 to 10) */
.section-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:560px){.section-grid{grid-template-columns:1fr 1fr;}}
.section-card{
  background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 16px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;
  box-shadow:0 4px 14px rgba(44,58,107,.05);transition:border-color .15s;
}
.section-card:hover{border-color:var(--indigo);}
.section-card.mistake-card{border-color:#f5c2c7;background:#fffafa;}
.mixed-exam-card{
  background:linear-gradient(135deg,#1c2749 0%,#2c3a6b 100%);
  color:#fff;border:2px solid var(--indigo-deep);border-radius:16px;padding:18px 18px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;width:100%;
  box-shadow:0 8px 22px rgba(28,39,73,.18);margin-bottom:14px;transition:transform .12s;
}
.mixed-exam-card:active{transform:scale(.99);}
.mixed-exam-card .me-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.mixed-exam-card .me-badge{
  background:var(--marigold);color:#fff;font-size:.7rem;font-weight:800;
  padding:3px 10px;border-radius:999px;letter-spacing:.4px;
}
.mixed-exam-card .me-best{font-size:.76rem;color:var(--marigold-soft);font-weight:700;}
.mixed-exam-card h2{font-size:1.22rem;color:#fff;margin:0;}
.mixed-exam-card .me-ta{font-size:.86rem;color:#e2e8f0;font-weight:600;}
.mixed-exam-card .me-structure{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;
}
.mixed-exam-card .me-pill{
  background:rgba(255,255,255,.13);color:#fff;font-size:.72rem;font-weight:600;
  padding:3px 9px;border-radius:6px;
}
.mixed-exam-card .me-cta{
  margin-top:4px;padding-top:10px;border-top:1px solid rgba(255,255,255,.18);
  display:flex;justify-content:space-between;align-items:center;font-size:.84rem;font-weight:700;color:var(--marigold-soft);
}
.badge-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.section-badge{
  display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;
  padding:3px 8px;border-radius:999px;width:fit-content;background:#e4e9f7;color:var(--indigo-deep);
}
.section-badge.easy{background:var(--leaf-soft);color:var(--leaf);}
.section-badge.warn{background:var(--rose-soft);color:var(--rose);}
.section-card h2{font-size:1.1rem;color:var(--indigo-deep);}
.section-card .tamil-sub{font-size:.86rem;color:#575144;font-weight:600;}
.section-card .desc{font-size:.8rem;color:#6b6456;line-height:1.4;}
.section-stat{
  margin-top:auto;padding-top:9px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:600;color:var(--indigo);
}

/* Lesson picker */
.dashboard-strip{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;
  margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.dashboard-strip .stat-item{font-size:.82rem;color:#575144;font-weight:600;}
.dashboard-strip .stat-item b{color:var(--indigo-deep);font-size:.95rem;}

.lesson-grid{display:grid;grid-template-columns:1fr;gap:10px;}
.lesson-card{
  background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;
  display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%;
  font-family:'Inter',sans-serif;min-height:66px;
}
.lesson-card:hover{border-color:var(--indigo);}
.lesson-num{
  width:38px;height:38px;border-radius:10px;background:var(--marigold-soft);color:#8a5a12;
  display:flex;align-items:center;justify-content:center;font-family:'Lora',serif;font-weight:700;flex-shrink:0;font-size:.95rem;
}
.lesson-card.exam-pool{border-color:#c4b5fd;background:#faf8ff;}
.lesson-card.exam-pool .lesson-num{background:#e4dcf0;color:#5b3b8c;}
.lesson-info{flex:1;min-width:0;}
.lesson-info h3{font-size:.95rem;color:var(--ink);font-weight:600;line-height:1.3;}
.lesson-info p{font-size:.76rem;color:#8a8373;margin-top:2px;}
.step-dots{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.step-dot{font-size:.66rem;padding:2px 7px;border-radius:5px;background:var(--paper-deep);color:#6b6456;font-weight:600;}
.step-dot.partial{background:var(--marigold-soft);color:#7a4f0d;}
.step-dot.done{background:var(--leaf-soft);color:var(--leaf);}
.lesson-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.stars-row{font-size:.9rem;letter-spacing:1px;color:#d1cbb8;}
.stars-row .earned{color:var(--marigold);}
.progress-pill{font-size:.68rem;background:var(--paper-deep);color:#6b6456;padding:3px 8px;border-radius:999px;font-weight:600;}
.progress-pill.partial{background:var(--marigold-soft);color:#7a4f0d;}
.progress-pill.done{background:var(--leaf-soft);color:var(--leaf);}

/* Micro-Set Selector (Chunking for Slow Learners) */
.chunk-bar{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;align-items:center;
}
.chunk-pill{
  border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;
  font-size:.76rem;font-weight:600;color:#575144;cursor:pointer;white-space:nowrap;
}
.chunk-pill.done-set{border-color:var(--leaf);color:var(--leaf);background:#f3faf6;}
.chunk-pill.active{background:var(--marigold);border-color:var(--marigold);color:#fff;}

/* Mode tabs within a lesson */
.mode-tabs{display:flex;gap:8px;margin-bottom:14px;}
.mode-tab{
  flex:1;padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
  font-size:.8rem;font-weight:600;color:#8a8373;cursor:pointer;text-align:center;min-height:44px;
}
.mode-tab.active{background:var(--indigo);border-color:var(--indigo);color:#fff;}
.mode-tab .tick{color:var(--marigold-soft);margin-left:3px;}

/* Highlighted Target Word */
.hl-word{
  color:#b45309;background:#fef3c7;padding:1px 6px;border-radius:5px;font-weight:700;
  text-decoration:underline;text-decoration-color:#d97706;text-decoration-thickness:2.5px;text-underline-offset:3px;
}

/* Flashcard - Learn mode */
.card-counter{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:#8a8373;margin-bottom:8px;font-weight:600;}
.learn-bar{width:100%;height:6px;background:var(--paper-deep);border-radius:999px;overflow:hidden;margin-bottom:14px;}
.learn-bar-fill{height:100%;background:var(--indigo);transition:width .25s;}
.flashcard{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 20px;
  box-shadow:0 8px 24px rgba(44,58,107,.07);min-height:280px;display:flex;flex-direction:column;
}
.word-pair-hero{
  background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:16px;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;transition:background .15s,border-color .15s;
}
.word-pair-hero.speaking{background:var(--marigold-soft);border-color:var(--marigold);}
.target-word-lg{font-family:'Lora',serif;font-weight:700;font-size:1.45rem;color:var(--indigo-deep);}
.pair-sign-lg{font-weight:700;font-size:1.25rem;color:var(--marigold);}
.meaning-word-lg{font-family:'Lora',serif;font-weight:600;font-size:1.35rem;color:var(--leaf);}
.ant-mode .meaning-word-lg{color:var(--rose);}
.exam-tag{margin-left:auto;font-size:.68rem;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:6px;font-weight:600;}

/* Visual Snip & Join Aid Box */
.visual-aid-box{
  background:#fff;border:1.5px solid #cbd5e1;border-radius:12px;padding:12px 14px;
  margin-bottom:12px;display:flex;flex-direction:column;gap:8px;
}
.visual-aid-box.clip-aid{background:#f0fdf4;border-color:#86efac;}
.visual-aid-box.blend-aid{background:#eff6ff;border-color:#93c5fd;}
.visual-aid-box.comp-aid{background:#fefce8;border-color:#fde047;}
.visual-aid-box.rule-aid{background:#f5f3ff;border-color:#c4b5fd;}
.v-label{font-size:.72rem;font-weight:700;color:#334155;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.v-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:'Lora',serif;font-size:1.08rem;}
.v-pill{
  background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;padding:5px 10px;
  display:inline-flex;align-items:center;letter-spacing:.3px;box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.v-keep{color:var(--indigo-deep);font-weight:700;background:#dbeafe;padding:1px 4px;border-radius:4px;}
.clip-aid .v-keep{color:#14532d;background:#bbf7d0;}
.rule-aid .v-keep{color:#4c1d95;background:#ede9fe;}
.v-cut{color:#9ca3af;text-decoration:line-through;text-decoration-color:var(--rose);text-decoration-thickness:2px;padding:0 1px;}
.v-op{font-family:'Inter',sans-serif;font-weight:800;font-size:.92rem;color:var(--marigold);}
.v-result{
  background:var(--leaf);color:#fff;font-weight:700;padding:5px 12px;border-radius:8px;
  letter-spacing:.3px;box-shadow:0 2px 6px rgba(60,122,94,.22);
}
.blend-aid .v-result{background:var(--indigo);}
.rule-aid .v-result{background:#5b21b6;}

/* Tamil Syllable Transliteration (Training Wheels) */
.pron-box{
  background:var(--sky-soft);border-left:4px solid var(--sky);border-radius:8px;
  padding:8px 12px;margin-bottom:10px;display:none;align-items:center;justify-content:space-between;gap:8px;
}
.pron-box.show{display:flex;}
.pron-box .label{font-size:.7rem;color:#1e40af;font-weight:700;}
.pron-box .txt{font-size:1.02rem;color:#1e3a8a;font-weight:700;}

/* Tamil Meaning Box */
.tamil-meaning{
  background:var(--paper-deep);border-radius:10px;padding:11px 14px;margin-bottom:12px;display:none;
  border-left:4px solid var(--marigold);transition:background .15s;
}
.tamil-meaning.show{display:block;}
.tamil-meaning.speaking{background:var(--marigold-soft);}
.tamil-meaning .label{font-size:.7rem;color:#6b6456;font-weight:600;margin-bottom:2px;}
.tamil-meaning .txt{font-size:1.06rem;color:var(--ink);font-weight:600;}

/* Separate Example Sentence Section */
.sentence-example-box{
  background:#f9f9f6;border:1.5px dashed var(--line);border-radius:12px;padding:13px 15px;margin-bottom:auto;
  transition:background .15s,border-color .15s;
}
.sentence-example-box.speaking{
  background:var(--marigold-soft);border-color:var(--marigold);border-style:solid;
}
.sent-head-row{
  display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;
}
.sentence-example-label{font-size:.7rem;color:#8a8373;font-weight:700;text-transform:uppercase;}
.sent-audio-btn{
  background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;
  font-size:.76rem;font-weight:600;color:var(--indigo);cursor:pointer;display:inline-flex;align-items:center;gap:5px;
}
.sent-audio-btn:hover{border-color:var(--indigo);}
.sent-audio-btn:active{background:var(--marigold-soft);}
.sentence{font-size:1rem;line-height:1.7;color:var(--ink);font-family:'Lora',serif;}

.card-actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap;}
.icon-btn{
  border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:46px;padding:0 12px;
  display:flex;align-items:center;justify-content:center;gap:5px;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--indigo);
}
.icon-btn.primary-audio{background:var(--indigo);color:#fff;border-color:var(--indigo);flex:1;min-width:175px;}
.icon-btn.tamil-toggle.show{background:var(--marigold);color:#fff;border-color:var(--marigold);}
.icon-btn.pron-toggle.show{background:var(--sky);color:#fff;border-color:var(--sky);}
.speed-select{
  border:1.5px solid var(--line);border-radius:10px;padding:0 8px;font-size:.82rem;color:var(--ink);
  background:#fff;min-height:46px;font-family:'Inter',sans-serif;font-weight:600;
}
.nav-row{display:flex;gap:10px;margin-top:12px;}
.nav-btn{

if(state.name) state.screen = 'home';

let mixedTimerId = null;
function stopMixedTimer(){
  if(mixedTimerId){ clearInterval(mixedTimerId); mixedTimerId = null; }
}
function formatClock(sec){
  const s = Math.max(0, sec);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}
function startMixedTimer(){
  stopMixedTimer();
  mixedTimerId = setInterval(()=>{
    if(state.screen !== 'mixed_exam' || state.mixedSubmitted){
      stopMixedTimer();
      return;
    }
    state.mixedTimeTaken++;
    if(state.mixedSecondsLeft > 0) state.mixedSecondsLeft--;
    const clockEl = document.getElementById('mixedClock');
    if(clockEl){
      clockEl.textContent = state.mixedSecondsLeft > 0
        ? `Time Left: ${formatClock(state.mixedSecondsLeft)}`
        : `Extra Time: +${formatClock(state.mixedTimeTaken - 900)}`;
    }
  }, 1000);
}

function currentTopic(){
  return TOPICS.find(t=>t.id===state.topicId) || TOPICS[0];
}
function currentLesson(){
  if(state.topicId === 'mistakes'){
    return { id:1, title:'My Saved Mistakes', words: getMistakeBank() };
  }
  const t = currentTopic();
  return t.lessons.find(l=>l.id===state.lessonId) || t.lessons[0];
}

/* Active words slice (3-word Micro-Sets when Easy Chunk Mode is ON) */
function activeWords(lesson){
  const all = lesson.words || [];
  if(!state.easyChunkMode || all.length <= 4) return all;
  const size = 3;
  const start = state.chunkIdx * size;
  return all.slice(start, start + size);
}
function totalChunks(lesson){
  const all = lesson.words || [];
  if(!state.easyChunkMode || all.length <= 4) return 1;
  return Math.ceil(all.length / 3);
}

/* Progress & Micro-Set Persistence (Dedicated tn10_ keys) */
function progressKey(topicId, lessonId){ return `tn10_${topicId}_prog_${lessonId}`; }
function getProgress(topicId, lessonId){
  try{ return JSON.parse(safeGet(progressKey(topicId, lessonId))||'{}'); }catch(e){ return {}; }
}
function saveProgress(topicId, lessonId, patch){
  if(topicId === 'mistakes') return {};
  const cur = getProgress(topicId, lessonId);
  const next = {...cur, ...patch};
  safeSet(progressKey(topicId, lessonId), JSON.stringify(next));
  return next;
}
function markChunkCompleted(topicId, lessonId, kind, chunkIdx, total){
  if(topicId === 'mistakes') return;
  const cur = getProgress(topicId, lessonId);
  const arrKey = kind === 'learn' ? 'learnSets' : 'practiceSets';
  const doneKey = kind === 'learn' ? 'learnDone' : 'practiceDone';
  const arr = Array.isArray(cur[arrKey]) ? [...cur[arrKey]] : [];
  if(!arr.includes(chunkIdx)) arr.push(chunkIdx);
  const allDone = !state.easyChunkMode || total <= 1 || arr.length >= total;
  const patch = { [arrKey]: arr };
  if(allDone) patch[doneKey] = true;
  saveProgress(topicId, lessonId, patch);
}
function firstUnfinishedChunk(topicId, lesson){
  const total = totalChunks(lesson);
  if(total <= 1) return 0;
  const prog = getProgress(topicId, lesson.id);
  const lSets = Array.isArray(prog.learnSets) ? prog.learnSets : [];
  const pSets = Array.isArray(prog.practiceSets) ? prog.practiceSets : [];
  for(let c=0; c<total; c++){
    if(!lSets.includes(c) || !pSets.includes(c)) return c;
  }
  return 0;
}
function calcStars(prog){
  let s = 0;
  if(prog.learnDone) s++;
  if(prog.practiceDone) s++;
  if(prog.examDone) s++;
  return s;
}

function getMistakeBank(){
  try{ return JSON.parse(safeGet('tn10_mistakes_bank')||'[]'); }catch(e){ return []; }
}
function recordMistake(item){
  const bank = getMistakeBank();
  if(!bank.some(x=>x.w===item.w && x.m===item.m)){
    bank.push({
      topicId: item.topicId || item._topicId || state.topicId,
      w:item.w, m:item.m, p:item.p||'', tm:item.tm||'', s:item.s,
      qS:item.qS||'', qAns:item.qAns||'', qTm:item.qTm||'',
      qPair:item.qPair||null, qDistractors:item.qDistractors||null,
      vis:item.vis||null
    });
    safeSet('tn10_mistakes_bank', JSON.stringify(bank));
  }
}
function removeMistake(item){
  const bank = getMistakeBank().filter(x=>!(x.w===item.w && x.m===item.m));
  safeSet('tn10_mistakes_bank', JSON.stringify(bank));
}

/* ---------------- TTS ENGINE ---------------- */
let speechSessionId = 0;
let voicesCache = [];
function loadVoices(){
  try{
    if(typeof window !== 'undefined' && 'speechSynthesis' in window){
      voicesCache = window.speechSynthesis.getVoices() || [];
    }
  }catch(e){}
}
loadVoices();
try{
  if(typeof window !== 'undefined' && 'speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
}catch(e){}

function pickVoice(langPref){
  if(!voicesCache.length) loadVoices();
  if(langPref === 'ta'){
    return voicesCache.find(v=>v.lang && v.lang.toLowerCase().startsWith('ta')) || null;
  }
  const inVoice = voicesCache.find(v=>v.lang && (v.lang.toLowerCase()==='en-in' || v.lang.toLowerCase().includes('in')));
  if(inVoice) return inVoice;
  return voicesCache.find(v=>v.lang && v.lang.toLowerCase().startsWith('en')) || null;
}
function cancelSpeech(){
  speechSessionId++;
  try{
    if(typeof window !== 'undefined' && 'speechSynthesis' in window) window.speechSynthesis.cancel();
  }catch(e){}
  document.querySelectorAll('.speaking').forEach(el=>el.classList.remove('speaking'));
}
function speakSteps(steps){
  if(typeof window === 'undefined' || !('speechSynthesis' in window)) return;
  cancelSpeech();
  const mySession = speechSessionId;
  let i = 0;
  function next(){
    if(mySession !== speechSessionId) return;
    document.querySelectorAll('.speaking').forEach(el=>el.classList.remove('speaking'));
    if(i >= steps.length) return;
    const step = steps[i];
    if(step.el) step.el.classList.add('speaking');
    const u = new SpeechSynthesisUtterance(step.text);
    const v = pickVoice(step.lang || 'en');
    if(v){ u.voice = v; u.lang = v.lang; }
    else { u.lang = step.lang === 'ta' ? 'ta-IN' : 'en-IN'; }
    u.rate = state.speechRate;
    u.onend = ()=>{
      if(mySession!==speechSessionId) return;
      if(step.el) step.el.classList.remove('speaking');
      i++;
      setTimeout(next, 180);
    };
    u.onerror = ()=>{
      if(mySession!==speechSessionId) return;
      if(step.el) step.el.classList.remove('speaking');
      i++;
      next();
    };
    window.speechSynthesis.speak(u);
  }
  setTimeout(next, 60);
}

/* ---------------- QUIZ, SSLC BOARD EXAM PROMPTS & DISTRACTOR HELPERS ---------------- */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function getQuizSentence(item){ return item.qS || item.s; }
function getQuizAnswer(item){ return item.qAns || item.m; }

/* Exact TN Class 10 SSLC Board Exam Prompts for Exam Mode (Q.No. 7–14) */
function getExamSentence(item, topicId){
  const tid = topicId || item.topicId || item._topicId || state.topicId;
  if(tid === 'plural'){
    return `Choose the correct plural form of "<b><u>${escapeHtml(item.w)}</u></b>".`;
  }
  if(tid === 'affixes' && item.vis){
    if(item.vis.left && item.vis.left.endsWith('-')){
      return `Form a derivative by adding the right prefix to the word "<b><u>${escapeHtml(item.vis.right)}</u></b>".`;
    }
    if(item.vis.right && item.vis.right.startsWith('-')){
      return `Form a derivative by adding the right suffix to the word "<b><u>${escapeHtml(item.vis.left)}</u></b>".`;
    }
  }
  if(tid === 'abbreviations'){
    return `Choose the correct expansion of the abbreviation "<b><u>${escapeHtml(item.w)}</u></b>".`;
  }
  if(tid === 'compound' && item.w.includes('+')){
    const firstWord = item.w.split('+')[0].trim().toLowerCase();
    return `Choose the suitable option to pair with "<b><u>${escapeHtml(firstWord)}</u></b>" to form a compound word.`;
  }
  return getQuizSentence(item);
}

function allAnswersPoolForTopic(topicId, excludeAns){
  const pool = [];
  const t = TOPICS.find(x=>x.id===topicId);
  const sourceTopics = t ? [t] : TOPICS;
  sourceTopics.forEach(tp=>tp.lessons.forEach(l=>l.words.forEach(w=>{
    const val = getQuizAnswer(w);
    if(val.toLowerCase() !== String(excludeAns||'').toLowerCase() && !pool.includes(val)){
      pool.push(val);
    }
  })));
  return pool;
}

function buildChoicesForItem(item, optionCount, forcedTopicId){
  const ans = getQuizAnswer(item);
  if(Array.isArray(item.qPair) && item.qPair.length >= 2){
    if(optionCount === 2) return shuffle(item.qPair.slice(0,2));
    const extra = shuffle(allAnswersPoolForTopic(forcedTopicId || state.topicId, ans).filter(x=>!item.qPair.includes(x))).slice(0, optionCount - item.qPair.length);
    return shuffle([...item.qPair, ...extra]);
  }
  if(Array.isArray(item.qDistractors) && item.qDistractors.length > 0){
    const chosenDistractors = shuffle(item.qDistractors).slice(0, optionCount - 1);
    return shuffle([ans, ...chosenDistractors]);
  }
  const tid = forcedTopicId || item.topicId || item._topicId || state.topicId;
  const pool = shuffle(allAnswersPoolForTopic(tid, ans)).slice(0, optionCount - 1);
  return shuffle([ans, ...pool]);
}

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function stripTags(html){ const d = document.createElement('div'); d.innerHTML = html; return d.textContent || ''; }
function cleanForSpeech(html){

}
function formatHighlightSentence(rawHtml){

}

function renderSegsHtml(segs){

          <span class="v-result">${escapeHtml(word.m)}</span>

  if(word.vis && word.vis.type === 'blend'){
    return `
      <div class="visual-aid-box blend-aid">
        <div class="v-label tamil">&#129513; Joining Parts Visual (இரண்டு சொற்களின் பகுதிகளை இணைத்தல்):</div>
        <div class="v-flow">

          <span class="v-op">+</span>
          <span class="v-pill">${renderSegsHtml(word.vis.w2)}</span>
          <span class="v-op">&#8594;</span>
          <span class="v-result">${escapeHtml(word.w)}</span>
        </div>
      </div>
    `;
  }
  if(effTopic === 'compound' && word.w.includes('+')){
    const parts = word.w.split('+').map(s=>s.trim());
    return `
      <div class="visual-aid-box comp-aid">
        <div class="v-label tamil">&#128279; Word + Word Join (இரண்டு முழுச் சொற்களை இணைத்தல்):</div>
        <div class="v-flow">
          <span class="v-pill"><span class="v-keep">${escapeHtml(parts[0])}</span></span>
          <span class="v-op">+</span>
          <span class="v-pill"><span class="v-keep">${escapeHtml(parts[1])}</span></span>
          <span class="v-op">=</span>
          <span class="v-result">${escapeHtml(word.m)}</span>
        </div>
      </div>
    `;
  }
  if(word.vis && word.vis.type === 'affix'){
    return `
      <div class="visual-aid-box rule-aid">
        <div class="v-label tamil">&#10133; Prefix / Suffix Join (முன்னொட்டு / பின்னொட்டு இணைப்பு):</div>
        <div class="v-flow">
          <span class="v-pill"><span class="v-keep">${escapeHtml(word.vis.left)}</span></span>
          <span class="v-op">+</span>
          <span class="v-pill"><span class="v-keep">${escapeHtml(word.vis.right)}</span></span>
          <span class="v-op">&#8594;</span>
          <span class="v-result">${escapeHtml(word.vis.res)}</span>
        </div>
      </div>
    `;
  }
  if(word.vis && word.vis.type === 'plural'){
    return `
      <div class="visual-aid-box rule-aid">
        <div class="v-label tamil">&#128260; Ending Change Rule (இறுதி எழுத்து மாற்றம்):</div>
        <div class="v-flow">
          <span class="v-pill">${escapeHtml(word.vis.stem)}<span class="v-cut">${escapeHtml(word.vis.oldEnd)}</span></span>
          <span class="v-op">&#8594;</span>
          <span class="v-result">${escapeHtml(word.vis.stem)}<u>${escapeHtml(word.vis.newEnd)}</u></span>
        </div>
      </div>
    `;
  }
  if(word.vis && word.vis.type === 'tag'){
    return `
      <div class="visual-aid-box rule-aid">
        <div class="v-label tamil">&#127991;&#65039; Grammar Rule (இலக்கண விதி):</div>
        <div class="v-flow">
          <span class="v-pill"><span class="v-keep">${escapeHtml(word.vis.rule)}</span></span>
          <span class="v-op">&#8594;</span>
          <span class="v-result">${escapeHtml(word.vis.res)}</span>
        </div>
      </div>
    `;
  }
  return '';
}

function findTamilForMeaning(choiceStr, item){
  if(item && Array.isArray(item.qDistractors) && item.qDistractors.length > 0){
    return '';
  }
  const pools = state.topicId === 'mistakes' ? TOPICS : [currentTopic(), ...TOPICS];
  for(const t of pools){
    for(const l of (t.lessons || [])){
      for(const w of l.words){
        if(w.qAns === choiceStr && w.qTm) return w.qTm;
        if(w.m === choiceStr && w.tm){
          return (t.id === 'antonyms' && w.tm.includes('×'))
            ? w.tm.split('×')[1].trim()
            : w.tm;
        }
      }
    }
  }
  return '';
}

    else if(stars > 0 || hasPartialSets){ statusClass = ' partial'; statusText = 'In Progress'; }
    const starHtml = [1,2,3].map(n=>`<span class="${n<=stars?'earned':''}">&#9733;</span>`).join('');

    const learnLabel = prog.learnDone
      ? '1. Learn &#10003;'
      : (totSets > 1 && lDoneCount > 0 ? `1. Learn (${lDoneCount}/${totSets} Sets)` : '1. Learn');
    const pracLabel = prog.practiceDone
      ? `2. Practice &#10003; ${prog.lastScore||0}%`
      : (totSets > 1 && pDoneCount > 0 ? `2. Practice (${pDoneCount}/${totSets} Sets)` : '2. Practice');

    const card = document.createElement('button');
    card.className = 'lesson-card' + (lesson.isExam?' exam-pool':'');
    card.innerHTML = `
      <div class="lesson-num">${lesson.isExam ? '&#9733;' : lesson.id}</div>
      <div class="lesson-info">
        <h3>${escapeHtml(lesson.title)}</h3>
        <p>${lesson.words.length} items ${prog.bestExam!==undefined ? ` &bull; Best Exam: ${prog.bestExam}/${lesson.words.length}` : ''}</p>
        <div class="step-dots">
          <span class="step-dot ${prog.learnDone?'done':(lDoneCount>0?'partial':'')}">${learnLabel}</span>
          <span class="step-dot ${prog.practiceDone?'done':(pDoneCount>0?'partial':'')}">${pracLabel}</span>
          <span class="step-dot ${prog.examDone?'done':''}">3. Exam ${prog.examDone?'&#10003;':''}</span>
        </div>
      </div>
      <div class="lesson-right">
        <div class="stars-row">${starHtml}</div>
        <span class="progress-pill${statusClass}">${statusText}</span>
      </div>
    `;
    card.onclick = ()=>{
      state.lessonId = lesson.id;
      state.chunkIdx = firstUnfinishedChunk(topic.id, lesson);
      state.cardIdx = 0;
      state.mode = 'learn';
      state.learnDoneModal = false;
      state.practiceQueue = [];
      state.examQuestions = [];
      state.screen = 'lesson';
      render();
    };
    grid.appendChild(card);
  });

  main.appendChild(grid);
  app.appendChild(main);
}

/* ---------------- SCREEN 4: LESSON HUB ---------------- */
function renderLessonHub(app){
  app.innerHTML = '';
  const topic = currentTopic();
  const lesson = currentLesson();
  const isMistakes = state.topicId === 'mistakes';
  const prog = getProgress(state.topicId, lesson.id);

  const backAction = ()=>{
    state.screen = (!isMistakes && topic.lessons.length > 1) ? 'lessons' : 'home';
    render();
  };
  app.appendChild(topbar(isMistakes ? 'My Hard Words' : lesson.title, backAction));

  const main = document.createElement('main');
  if(state.topicId === 'antonyms') main.classList.add('ant-mode');

  /* Micro-Set Selector (When Easy 3-Word Mode is ON and lesson has >4 words) */
  const chunks = totalChunks(lesson);
  if(chunks > 1 && state.mode !== 'exam'){
    const doneSetArr = state.mode === 'learn'
      ? (Array.isArray(prog.learnSets) ? prog.learnSets : [])
      : (Array.isArray(prog.practiceSets) ? prog.practiceSets : []);
    const cbar = document.createElement('div');
    cbar.className = 'chunk-bar screen';
    cbar.innerHTML = `<span style="font-size:.74rem;font-weight:700;color:#6b6456;white-space:nowrap;">Micro-Sets:</span>`;
    for(let c=0; c<chunks; c++){
      const startN = c*3 + 1;
      const endN = Math.min((c+1)*3, lesson.words.length);
      const isSetDone = doneSetArr.includes(c);
      const b = document.createElement('button');
      b.className = 'chunk-pill' + (isSetDone ? ' done-set' : '') + (state.chunkIdx===c ? ' active' : '');
      b.innerHTML = `Set ${c+1} (${startN}–${endN})${isSetDone ? ' &#10003;' : ''}`;
      b.onclick = ()=>{
        cancelSpeech();
        state.chunkIdx = c;
        state.cardIdx = 0;
        state.learnDoneModal = false;
        if(state.mode==='practice') buildPracticeQueue();
        render();
      };
      cbar.appendChild(b);
    }
    main.appendChild(cbar);
  }

  const tabs = document.createElement('div');
  tabs.className = 'mode-tabs screen';
  tabs.innerHTML = `
    <button class="mode-tab ${state.mode==='learn'?'active':''}" data-m="learn">
      1. Learn ${prog.learnDone?'<span class="tick">&#9733;</span>':''}
    </button>
    <button class="mode-tab ${state.mode==='practice'?'active':''}" data-m="practice">
      2. Practice ${prog.practiceDone?'<span class="tick">&#9733;</span>':''}
    </button>
    <button class="mode-tab ${state.mode==='exam'?'active':''}" data-m="exam">
      3. Exam Paper ${prog.examDone?'<span class="tick">&#9733;</span>':''}
    </button>
  `;
  tabs.querySelectorAll('.mode-tab').forEach(b=>{
    b.onclick = ()=>{
      cancelSpeech();
      state.mode = b.dataset.m;
      state.learnDoneModal = false;
      state.cardIdx = 0; state.qIdx = 0; state.score = 0; state.missed = [];
      state.examSubmitted = false; state.examAnswers = {};
      if(state.mode==='practice') buildPracticeQueue();
      if(state.mode==='exam') buildExamQuestions();
      render();
    };
  });
  main.appendChild(tabs);

  const body = document.createElement('div');
  body.id = 'modeBody';
  main.appendChild(body);
  app.appendChild(main);

  if(state.mode==='learn') renderLearn(body, lesson);
  else if(state.mode==='practice'){ if(state.practiceQueue.length===0) buildPracticeQueue(); renderPractice(body, lesson); }
  else if(state.mode==='exam'){ if(state.examQuestions.length===0) buildExamQuestions(); renderExam(body, lesson); }
}

/* ---------------- MODE 1: LEARN ---------------- */
function renderLearn(body, lesson){
  cancelSpeech();
  const topic = currentTopic();
  const words = activeWords(lesson);
  if(!words.length){
    body.innerHTML = `<div class="bridge-card"><h2>All caught up!</h2><p>No saved mistakes left to review.</p></div>`;
    return;
  }

  if(state.learnDoneModal){
    markChunkCompleted(state.topicId, lesson.id, 'learn', state.chunkIdx, totalChunks(lesson));
    const hasMoreSets = state.chunkIdx < totalChunks(lesson) - 1;
    const wrap = document.createElement('div');
    wrap.className = 'screen bridge-card';
    wrap.innerHTML = `
      <div class="bridge-stars">&#11088;</div>
      <h2 class="serif">Great Job, ${escapeHtml(state.name)}!</h2>
      <p>Set ${state.chunkIdx+1} progress saved! You learned these ${words.length} items.<br>Practice these exact ${words.length} items now before moving on!</p>
      <button class="nav-btn next-step-cta" id="goPracticeNow" style="width:100%;margin-bottom:10px;">
        Practice These ${words.length} Words Now &#8594;
      </button>
      ${hasMoreSets ? `<button class="nav-btn primary" id="nextSetBtn" style="width:100%;margin-bottom:10px;">Skip to Next 3-Word Set &#8594;</button>` : ''}
      <button class="nav-btn" id="reviewAgainBtn" style="width:100%;">&#8634; Read Again</button>
    `;
    body.innerHTML=''; body.appendChild(wrap);
    wrap.querySelector('#goPracticeNow').onclick = ()=>{
      state.learnDoneModal = false;
      state.mode = 'practice';
      buildPracticeQueue();
      render();
    };
    const nextSet = wrap.querySelector('#nextSetBtn');
    if(nextSet) nextSet.onclick = ()=>{
      state.chunkIdx++;
      state.cardIdx = 0;
      state.learnDoneModal = false;
      render();
    };
    wrap.querySelector('#reviewAgainBtn').onclick = ()=>{
      state.learnDoneModal = false;
      state.cardIdx = 0;
      renderLearn(body, lesson);
    };
    return;
  }

  const i = Math.min(state.cardIdx, words.length - 1);
  const word = words[i];
  const itemTopic = (word.topicId && TOPICS.find(t=>t.id===word.topicId)) || topic;
  const pct = Math.round(((i+1)/words.length)*100);
  const sentenceColored = formatHighlightSentence(word.s);
  const visualAidHtml = renderVisualAid(word, itemTopic.id);

  const wrap = document.createElement('div');
  wrap.className = 'screen';
  wrap.innerHTML = `
    <div class="card-counter">
      <span>Item ${i+1} of ${words.length} ${totalChunks(lesson)>1 ? `(Set ${state.chunkIdx+1}/${totalChunks(lesson)})` : ''}</span>
      <span>${escapeHtml(itemTopic.title)}</span>
    </div>
    <div class="learn-bar"><div class="learn-bar-fill" style="width:${pct}%"></div></div>
    <div class="flashcard">
      <div class="word-pair-hero" id="pairBox">
        <span class="target-word-lg">${escapeHtml(word.w)}</span>
        <span class="pair-sign-lg">${escapeHtml(itemTopic.sign)}</span>
        <span class="meaning-word-lg">${escapeHtml(word.m)}</span>
        ${word.tag ? `<span class="exam-tag">${escapeHtml(word.tag)}</span>` : ''}
      </div>

      ${visualAidHtml}

      <!-- TAMIL SYLLABLE TRANSLITERATION (TRAINING WHEELS) -->
      <div class="pron-box ${state.showPron && word.p ? 'show' : ''}" id="pronBox">
        <div>
          <div class="label tamil">உச்சரிப்பு (How to Read Aloud)</div>
          <div class="txt tamil">${escapeHtml(word.p || '')}</div>
        </div>
      </div>

      <!-- TAMIL MEANING BRIDGE -->
      <div class="tamil-meaning ${state.showTamil?'show':''}" id="tamilBox">
        <div class="label tamil">தமிழ் அர்த்தம் (Meaning in Tamil)</div>
        <div class="txt tamil">${escapeHtml(word.tm || word.m)}</div>
      </div>

      <!-- SEPARATE EXAMPLE SENTENCE WITH ITS OWN AUDIO BUTTON -->
      <div class="sentence-example-box" id="sentBox">
        <div class="sent-head-row">
          <div class="sentence-example-label">Example Sentence:</div>
          <button class="sent-audio-btn" id="readSentOnlyBtn">&#128266; Read Sentence</button>
        </div>
        <div class="sentence">${sentenceColored}</div>
      </div>

      <div class="card-actions">
        <button class="icon-btn primary-audio" id="playBtn">&#128266; Listen Word &amp; Meaning</button>
        <button class="icon-btn pron-toggle ${state.showPron?'show':''}" id="pronBtn">உச்சரிப்பு</button>
        <button class="icon-btn tamil-toggle ${state.showTamil?'show':''}" id="tamilBtn">அர்த்தம்</button>
        <select class="speed-select" id="speedSel" aria-label="Speech speed">
          <option value="0.7" ${state.speechRate===0.7?'selected':''}>0.7x Slow</option>
          <option value="0.9" ${state.speechRate===0.9?'selected':''}>0.9x Clear</option>
          <option value="1" ${state.speechRate===1?'selected':''}>1x Normal</option>
        </select>
      </div>

      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" ${i===0?'disabled':''}>&#8592; Previous</button>
        <button class="nav-btn ${i===words.length-1?'next-step-cta':'primary'}" id="nextBtn">
          ${i===words.length-1 ? 'Practice These '+words.length+' &#8594;' : 'Next &#8594;'}
        </button>
      </div>
    </div>
  `;
  body.innerHTML=''; body.appendChild(wrap);

  wrap.querySelector('#playBtn').onclick = ()=>{
    const spokenLeft = word.w.replace(/\s*\+\s*/g, ' plus ');
    const spokenRight = word.m.replace(/\//g, ' or ');
    const steps = [
      { text: `${spokenLeft}, ${itemTopic.connector}, ${spokenRight}.`, el: wrap.querySelector('#pairBox'), lang:'en' }
    ];
    speakSteps(steps);
  };

  wrap.querySelector('#readSentOnlyBtn').onclick = ()=>{
    speakSteps([
      { text: cleanForSpeech(word.s), el: wrap.querySelector('#sentBox'), lang:'en' }
    ]);
  };

  wrap.querySelector('#pronBtn').onclick = ()=>{
    state.showPron = !state.showPron;
    const pb = wrap.querySelector('#pronBox');
    if(pb && word.p) pb.classList.toggle('show', state.showPron);
    wrap.querySelector('#pronBtn').classList.toggle('show', state.showPron);
  };
  wrap.querySelector('#tamilBtn').onclick = ()=>{
    state.showTamil = !state.showTamil;
    wrap.querySelector('#tamilBox').classList.toggle('show', state.showTamil);
    wrap.querySelector('#tamilBtn').classList.toggle('show', state.showTamil);
  };
  wrap.querySelector('#speedSel').onchange = e=>{ state.speechRate = parseFloat(e.target.value); };
  wrap.querySelector('#prevBtn').onclick = ()=>{ cancelSpeech(); state.cardIdx = Math.max(0,i-1); renderLearn(body, lesson); };
  wrap.querySelector('#nextBtn').onclick = ()=>{
    cancelSpeech();
    if(i === words.length-1){
      state.learnDoneModal = true;
      renderLearn(body, lesson);
    } else {
      state.cardIdx = i+1;
      renderLearn(body, lesson);
    }
  };
}

/* ---------------- MODE 2: PRACTICE (2-Choice / 4-Choice + Second Chance) ---------------- */
function buildPracticeQueue(){
  const lesson = currentLesson();
  const subset = activeWords(lesson);
  state.practiceQueue = shuffle(subset.map((w,idx)=>({...w, idx})));
  state.qIdx = 0; state.score = 0; state.missed = [];
  nextQuestion();
}
function nextQuestion(){
  if(state.qIdx >= state.practiceQueue.length) return;
  const q = state.practiceQueue[state.qIdx];
  const optionCount = state.twoOptionMode ? 2 : 4;
  state.currentChoices = buildChoicesForItem(q, optionCount, q.topicId || state.topicId);
  state.wrongTried = [];
  state.answered = false;
}

function renderPractice(body, lesson){
  cancelSpeech();
  const topic = currentTopic();
  const wrap = document.createElement('div');
  wrap.className = 'screen';

  if(state.qIdx >= state.practiceQueue.length){
    const pct = Math.round((state.score / state.practiceQueue.length)*100);
    markChunkCompleted(state.topicId, lesson.id, 'practice', state.chunkIdx, totalChunks(lesson));
    saveProgress(state.topicId, lesson.id, { lastScore: pct });

    const hasMoreSets = state.chunkIdx < totalChunks(lesson) - 1;
    wrap.innerHTML = `
      <div class="bridge-card">
        <div class="bridge-stars">&#11088;&#11088;</div>
        <h2 class="serif">Practice Set Complete!</h2>
        <div class="exam-result" style="border:none;padding:8px 0;">
          <div class="big-score">${state.score} / ${state.practiceQueue.length}</div>
          <p style="color:#6b6456;">Set ${state.chunkIdx+1} Saved &bull; Accuracy: ${pct}%</p>
        </div>
        ${state.missed.length ? `
          <div class="empty-note" style="text-align:left;margin-top:10px;">
            <b>Review these (${state.missed.length}):</b><br>
            ${state.missed.map(m=>`<b>${escapeHtml(m.w)}</b> ${escapeHtml(topic.sign)} ${escapeHtml(getQuizAnswer(m))}`).join(' &bull; ')}
          </div>
          <button class="nav-btn primary" id="retryBtn" style="width:100%;margin-top:8px;">
            &#8634; Retry Missed (${state.missed.length})
          </button>
        ` : ''}
        ${hasMoreSets ? `
          <button class="nav-btn next-step-cta" id="nextChunkBtn" style="width:100%;margin-top:10px;">
            Learn Next 3-Word Set (Set ${state.chunkIdx+2}) &#8594;
          </button>
        ` : `
          <button class="nav-btn next-step-cta" id="examBtn" style="width:100%;margin-top:10px;">
            Go to Step 3: Exam Paper Mode &#8594;
          </button>
        `}
      </div>
    `;
    body.innerHTML=''; body.appendChild(wrap);
    const retry = wrap.querySelector('#retryBtn');
    if(retry) retry.onclick = ()=>{
      state.practiceQueue = shuffle(state.missed.map((w,idx)=>({...w, idx})));
      state.qIdx=0; state.score=0; state.missed=[]; nextQuestion(); renderPractice(body, lesson);
    };
    const nextChunk = wrap.querySelector('#nextChunkBtn');
    if(nextChunk) nextChunk.onclick = ()=>{
      state.chunkIdx++;
      state.mode = 'learn';
      state.cardIdx = 0;
      state.learnDoneModal = false;
      render();
    };
    const examBtn = wrap.querySelector('#examBtn');
    if(examBtn) examBtn.onclick = ()=>{
      state.mode='exam'; buildExamQuestions(); render();
    };
    return;
  }

  const q = state.practiceQueue[state.qIdx];
  const itemTopic = (q.topicId && TOPICS.find(t=>t.id===q.topicId)) || topic;
  const letters = ['A','B','C','D'];
  const qSentenceHtml = formatHighlightSentence(getQuizSentence(q));
  const correctAns = getQuizAnswer(q);

  wrap.innerHTML = `
    <div class="q-head">
      <span class="q-progress">Question ${state.qIdx+1} of ${state.practiceQueue.length}</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="pill-toggle ${state.twoOptionMode?'on':''}" id="toggleOptCount" style="padding:4px 9px;font-size:.72rem;flex-direction:row;">
          ${state.twoOptionMode ? '2 Options (Easy)' : '4 Options'}
        </button>
        <span class="score-chip">Score: ${state.score}</span>
      </div>
    </div>
    <div class="q-card">
      <div class="task-banner ${escapeHtml(itemTopic.taskClass || 'badge-pat')}">
        <div class="task-banner-en">${escapeHtml(itemTopic.taskBannerEn || 'CHOOSE THE CORRECT ANSWER')}</div>
        <div class="task-banner-ta tamil">${escapeHtml(itemTopic.taskBannerTa || '')}</div>
      </div>

      <div class="q-sentence-box" id="qSentBox">${qSentenceHtml}</div>

      <div class="hint-row">
        <button class="hint-link" id="readSentBtn">&#128266; Read Question</button>
        <button class="hint-link" id="hintBtn">&#128161; தமிழ் Hint &amp; உச்சரிப்பு</button>
        <button class="hint-link" id="optTamBtn">${state.showTamil ? 'Hide Option தமிழ்' : 'Show Option தமிழ்'}</button>
        <div class="hint-box tamil" id="hintBox">
          <b>${escapeHtml(q.w)}</b> ${q.p ? `(${escapeHtml(q.p)})` : ''} = <b>${escapeHtml(q.tm || correctAns)}</b>
        </div>
      </div>

      <div class="choice-list" id="choiceList"></div>
      <div class="feedback-banner" id="feedback">
        <span id="fbMsg"></span>
        <button class="next-inline-btn" id="nextQBtn" style="display:none;">Next &#8594;</button>
      </div>
    </div>
  `;
  body.innerHTML=''; body.appendChild(wrap);

  wrap.querySelector('#toggleOptCount').onclick = ()=>{
    state.twoOptionMode = !state.twoOptionMode;
    nextQuestion();
    renderPractice(body, lesson);
  };
  wrap.querySelector('#readSentBtn').onclick = ()=>{
    speakSteps([{ text: cleanForSpeech(getQuizSentence(q)), el: wrap.querySelector('#qSentBox') }]);
  };
  wrap.querySelector('#hintBtn').onclick = ()=>{
    wrap.querySelector('#hintBox').classList.toggle('show');
  };
  wrap.querySelector('#optTamBtn').onclick = ()=>{
    state.showTamil = !state.showTamil;
    renderPractice(body, lesson);
  };

  const list = wrap.querySelector('#choiceList');
  state.currentChoices.forEach((c,ci)=>{
    const row = document.createElement('div');
    row.className = 'choice-row';

    const spk = document.createElement('button');
    spk.className = 'choice-speak';
    spk.innerHTML = '&#128266;';
    spk.onclick = e=>{
      e.stopPropagation();
      speakSteps([{ text: c.replace(/\s*\+\s*/g,' plus ').replace(/\//g, ' or '), el: row }]);
    };

    const optTamil = findTamilForMeaning(c, q);
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.dataset.val = c;
    btn.innerHTML = `
      <span class="letter">${letters[ci]}</span>
      <div class="choice-body">
        <span>${escapeHtml(c)}</span>
        ${state.showTamil && optTamil ? `<span class="choice-tamil tamil">${escapeHtml(optTamil)}</span>` : ''}
      </div>
    `;
    btn.onclick = ()=>{
      if(state.answered || btn.disabled) return;
      cancelSpeech();
      const correct = (c === correctAns);
      const fb = wrap.querySelector('#feedback');
      const fbMsg = wrap.querySelector('#fbMsg');
      const nextBtn = wrap.querySelector('#nextQBtn');

      if(correct){
        state.answered = true;
        btn.classList.add('correct');
        if(state.wrongTried.length === 0){
          state.score++;
          if(state.topicId === 'mistakes') removeMistake(q);
        }
        list.querySelectorAll('.choice').forEach(b=>b.disabled=true);
        fb.className = 'feedback-banner show ok';
        fbMsg.textContent = `Correct! "${q.w}" ${itemTopic.sign} "${correctAns}".`;
        nextBtn.style.display = 'inline-block';
      } else {
        btn.classList.add('wrong');
        btn.disabled = true;
        state.wrongTried.push(c);
        recordMistake(q);
        if(!state.missed.some(x=>x.w===q.w)) state.missed.push(q);

        const remaining = Array.from(list.querySelectorAll('.choice')).filter(b=>!b.disabled);
        if(remaining.length >= 2 && state.wrongTried.length === 1){
          wrap.querySelector('#hintBox').classList.add('show');
          fb.className = 'feedback-banner show retry';
          fbMsg.textContent = `Not quite — check the Tamil hint above and try again!`;
        } else {
          state.answered = true;
          list.querySelectorAll('.choice').forEach(b=>{
            if(b.dataset.val === correctAns) b.classList.add('correct');
            b.disabled = true;
          });
          fb.className = 'feedback-banner show no';
          fbMsg.textContent = `Answer: "${q.w}" ${itemTopic.sign} "${correctAns}".`;
          nextBtn.style.display = 'inline-block';
        }
      }
    };

    row.appendChild(spk);
    row.appendChild(btn);
    list.appendChild(row);
  });

  wrap.querySelector('#nextQBtn').onclick = ()=>{
    cancelSpeech();
    state.qIdx++;
    nextQuestion();
    renderPractice(body, lesson);
  };
}

/* ---------------- MODE 3: AUTHENTIC TN CLASS 10 SSLC EXAM PAPER ---------------- */
function buildExamQuestions(){
  const lesson = currentLesson();
  state.examQuestions = shuffle(lesson.words).map(q=>{
    const itemTopic = q.topicId || state.topicId;
    return {
      raw: q,
      w: q.w,
      m: q.m,
      tm: q.qTm || q.tm || '',
      ans: getQuizAnswer(q),
      s: getExamSentence(q, itemTopic),
      choices: buildChoicesForItem(q, 4, itemTopic)
    };
  });
  state.examAnswers = {};
  state.examSubmitted = false;
}

function renderExam(body, lesson){
  cancelSpeech();
  const topic = currentTopic();
  const wrap = document.createElement('div');
  wrap.className = 'screen';

  if(state.examSubmitted){
    let score = 0;
    const lines = state.examQuestions.map((q,idx)=>{
      const given = state.examAnswers[idx];
      const right = given === q.ans;
      if(right) score++;
      else recordMistake(q.raw || lesson.words.find(w=>w.w===q.w) || q);
      return `
        <div class="rline ${right?'right':'wrong'}">
          <b>${idx+1}. ${escapeHtml(q.w)}</b> — Your answer: <u>${given?escapeHtml(given):'(Not answered)'}</u>
          ${right?' &#10003;':(` &#10007; &nbsp;[Correct: <b>${escapeHtml(q.ans)}</b>]`)}
        </div>
      `;
    }).join('');

    const prevProg = getProgress(state.topicId, lesson.id);
    const bestExam = Math.max(score, prevProg.bestExam || 0);
    saveProgress(state.topicId, lesson.id, { examDone:true, bestExam });

    wrap.innerHTML = `
      <div class="exam-result">
        <div class="bridge-stars">&#11088;&#11088;&#11088;</div>
        <h2 class="serif" style="color:var(--indigo-deep);">SSLC Exam Paper Completed!</h2>
        <div class="big-score">${score} / ${state.examQuestions.length}</div>
        <p style="color:#6b6456;font-size:.88rem;">All 3 Stars Earned for ${escapeHtml(lesson.title)}!</p>
        <div class="exam-review">${lines}</div>
        <div class="nav-row" style="margin-top:16px;flex-wrap:wrap;">

    const isRight = chosen === q.ans;
    const correctIdx = q.choices.indexOf(q.ans);

            : `&#10007; Wrong. Correct answer: <b>${correctLetter} ${escapeHtml(q.ans)}</b>${tamNote}`
          ) : ''}
        </div>

  const totalQ = state.examQuestions.length;

      const liveEl = wrap.querySelector('#examLiveScore');
      if(liveEl) liveEl.textContent = `Score: ${countUnitExamScore()} / ${totalQ}`;

  wrap.querySelector('#submitExam').onclick = ()=>{
    cancelSpeech();
    state.examSubmitted = true;
    renderExam(body, lesson);
    window.scrollTo({top:0, behavior:'smooth'});

}

/* ---------------- FULL MIXED SSLC PUBLIC EXAM PAPER (PART I: Q.NO. 1 TO 14) ---------------- */
function collectWordsFromTopic(topicId){
  const t = TOPICS.find(x=>x.id===topicId);
  if(!t) return [];
  const out = [];
  t.lessons.forEach(l=>l.words.forEach(w=>out.push({...w, _topicId:t.id, _topicTitle:t.title})));
  return out;
}

function buildMixedExam(){
  const synPool = shuffle(collectWordsFromTopic('synonyms')).slice(0, 3);
  const antPool = shuffle(collectWordsFromTopic('antonyms')).slice(0, 3);

  // Q.No. 7 to 14: 1 question from each of the 8 SSLC Part-I Vocab & Grammar topics (3 + 3 + 8 = 14 Marks)
  const otherIds = [
    'plural','affixes','abbreviations','phrasal',
    'compound','prepositions','tenses','linkers'
  ];

  const partC = [];
  otherIds.forEach(tid=>{
    const shuffledItems = shuffle(collectWordsFromTopic(tid));
    if(shuffledItems.length > 0) partC.push(shuffledItems[0]);
  });

  const combined = [...synPool, ...antPool, ...partC];
  state.mixedQuestions = combined.map(q=>({
    raw: q,
    topicId: q._topicId,
    topicLabel: q._topicTitle.replace(/^\d+\.\s*/, ''),
    w: q.w,
    m: q.m,
    tm: q.qTm || q.tm || '',
    ans: getQuizAnswer(q),
    s: getExamSentence(q, q._topicId),
    choices: buildChoicesForItem(q, 4, q._topicId)
  }));
  state.mixedAnswers = {};
  state.mixedSubmitted = false;
  state.mixedSecondsLeft = 15 * 60;
  state.mixedTimeTaken = 0;
}

function renderMixedExam(app){
  app.innerHTML = '';
  cancelSpeech();
  app.appendChild(topbar('SSLC Part-I Exam (Q.1–14)', ()=>{
    stopMixedTimer();
    state.screen = 'home';
    render();
  }));

  const wrap = document.createElement('div');

        else if(idx < 6) antScore++;

          ${right?' &#10003;':(` &#10007; &nbsp;[Correct: <b>${escapeHtml(q.ans)}</b>]`)}
        </div>
      `;
