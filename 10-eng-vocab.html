<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TN SSLC English Vocabulary Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&family=Lora:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2937;
  --paper:#faf7f1;
  --paper-deep:#f0ead9;
  --indigo:#2c3a6b;
  --indigo-deep:#1c2749;
  --marigold:#d98c2b;
  --marigold-soft:#f3dcb0;
  --leaf:#3c7a5e;
  --rose:#b5495b;
  --line:#d8d0bd;
  --exam-paper:#fcf9f2;
  --fs-base:1rem;
  --fs-lh:1.65;
  box-sizing:border-box;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Atkinson Hyperlegible','Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  font-size:var(--fs-base);
  line-height:var(--fs-lh);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;
}
body.large-text{--fs-base:1.14rem;}
body.relaxed-spacing{--fs-lh:2;}
body.relaxed-spacing .sentence, body.relaxed-spacing .q-sentence{letter-spacing:.02em;word-spacing:.15em;}
.tamil{font-family:'Noto Sans Tamil',sans-serif;}
h1,h2,h3,.serif{font-family:'Lora',serif;}
.app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  background:var(--indigo);color:#fff;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.12);
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
.topbar .brand{font-family:'Lora',serif;font-weight:600;font-size:1.02rem;display:flex;align-items:center;gap:8px;}
.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--marigold);flex-shrink:0;}
.topbar .right{display:flex;align-items:center;gap:10px;}
.topbar .student{font-size:.78rem;opacity:.85;}
.topbar button.back{background:none;border:none;color:#fff;font-size:1.3rem;line-height:1;cursor:pointer;padding:6px 8px;min-height:44px;min-width:44px;}
.topbar button.gear{background:none;border:none;color:#fff;font-size:1.15rem;cursor:pointer;min-height:44px;min-width:44px;}
main{flex:1;padding:20px 18px 90px;}
.screen{animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

/* Settings drawer */
.settings-panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
.settings-row .lbl{font-size:.9rem;font-weight:600;}
.seg-toggle{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;}
.seg-toggle button{border:none;background:#fff;padding:9px 14px;font-size:.82rem;font-weight:600;color:#8a8373;cursor:pointer;min-height:40px;}
.seg-toggle button.on{background:var(--indigo);color:#fff;}
.audio-warning{background:#fff3dc;border:1px solid var(--marigold-soft);color:#7a5a16;border-radius:10px;padding:12px 14px;font-size:.85rem;margin-bottom:14px;display:none;}
.audio-warning.show{display:block;}

/* Onboarding */
.onboard-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 22px;margin-top:8vh;box-shadow:0 10px 30px rgba(44,58,107,.08);}
.onboard-card h1{font-size:1.5rem;color:var(--indigo-deep);margin-bottom:6px;}
.onboard-card p.sub{color:#6b6456;font-size:.92rem;margin-bottom:22px;}
.onboard-card label{display:block;font-size:.85rem;color:#6b6456;margin-bottom:6px;font-weight:600;}
.onboard-card input[type=text]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:var(--paper);min-height:48px;}
.onboard-card input[type=text]:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}
.btn-primary{margin-top:18px;width:100%;background:var(--indigo);color:#fff;border:none;border-radius:10px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;min-height:48px;}
.btn-primary:active{background:var(--indigo-deep);}
.btn-primary:disabled{opacity:.5;}

/* Lesson picker */
.greet{margin-bottom:18px;}
.greet h1{font-size:1.4rem;color:var(--indigo-deep);}
.greet p{color:#6b6456;font-size:.9rem;margin-top:4px;}
.lesson-grid{display:grid;grid-template-columns:1fr;gap:10px;}
.lesson-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%;font-family:inherit;min-height:44px;}
.lesson-card:active{background:var(--paper-deep);}
.lesson-num{width:38px;height:38px;border-radius:9px;background:var(--marigold-soft);color:#8a5a12;display:flex;align-items:center;justify-content:center;font-family:'Lora',serif;font-weight:600;flex-shrink:0;}
.lesson-info h3{font-size:.98rem;color:var(--ink);font-weight:700;}
.lesson-info p{font-size:.78rem;color:#8a8373;margin-top:2px;}
.lesson-card.exam-pool .lesson-num{background:#e4dcf0;color:#5b3b8c;}
.progress-pill{margin-left:auto;font-size:.7rem;background:var(--paper-deep);color:#6b6456;padding:4px 10px;border-radius:999px;flex-shrink:0;}
.progress-pill.done{background:#dcefe3;color:var(--leaf);}
.review-banner{background:#fdeee0;border:1px solid var(--marigold-soft);border-radius:12px;padding:13px 15px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.review-banner .txt{font-size:.88rem;color:#7a5a16;font-weight:600;}
.review-banner button{background:var(--marigold);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:.8rem;font-weight:700;cursor:pointer;min-height:40px;}

/* Mode tabs */
.mode-tabs{display:flex;gap:8px;margin-bottom:18px;}
.mode-tab{flex:1;padding:11px 6px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:.8rem;font-weight:700;color:#8a8373;cursor:pointer;text-align:center;min-height:48px;font-family:inherit;}
.mode-tab.active{background:var(--indigo);border-color:var(--indigo);color:#fff;}

/* Flashcard */
.card-counter{text-align:center;font-size:.8rem;color:#8a8373;margin-bottom:10px;}
.flashcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 22px;box-shadow:0 8px 24px rgba(44,58,107,.07);min-height:280px;display:flex;flex-direction:column;}
.sentence{font-size:1.15rem;line-height:1.85;color:var(--ink);font-family:'Lora',serif;}
.tok{transition:background .12s, color .12s;border-radius:4px;padding:0 1px;}
.tok.target{font-weight:700;color:var(--indigo-deep);text-decoration:underline;text-decoration-color:var(--marigold);text-decoration-thickness:2.5px;}
.tok.speaking{background:var(--marigold-soft);}
.word-row{display:flex;align-items:baseline;gap:10px;margin-top:20px;flex-wrap:wrap;}
.target-word{font-family:'Lora',serif;font-weight:700;font-size:1.3rem;color:var(--indigo-deep);}
.word-top{background:var(--paper-deep);border-radius:12px;padding:16px;}
.word-top-main{display:flex;align-items:center;gap:10px;}
.word-top-meaning{color:#6b6456;font-size:1rem;margin-top:4px;}
.spk-inline{
  background:var(--indigo);color:#fff;border:none;border-radius:50%;
  width:40px;height:40px;min-width:40px;min-height:40px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem;cursor:pointer;
}
.spk-inline:active{background:var(--indigo-deep);}
.sentence-block{margin-top:18px;}
.sentence-label{display:flex;align-items:center;gap:10px;font-size:.82rem;font-weight:700;color:#8a8373;margin-bottom:8px;}
.sentence-label .spk-inline{width:34px;height:34px;min-width:34px;min-height:34px;font-size:.9rem;background:var(--marigold);}
.sentence-label .spk-inline:active{background:#b5751f;}
.tamil-meaning{margin-top:14px;background:var(--paper-deep);border-radius:10px;padding:12px 14px;display:none;}
.tamil-meaning.show{display:block;}
.tamil-meaning .label{font-size:.72rem;color:#8a8373;font-weight:700;margin-bottom:3px;}
.tamil-meaning .txt{font-size:1.08rem;color:var(--ink);}
.card-actions{display:flex;gap:10px;margin-top:auto;padding-top:20px;flex-wrap:wrap;}
.icon-btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:48px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:.88rem;font-weight:700;cursor:pointer;color:var(--indigo);font-family:inherit;}
.icon-btn.active-audio{background:var(--indigo);color:#fff;border-color:var(--indigo);}
.icon-btn.tamil-toggle.show{background:var(--marigold);color:#fff;border-color:var(--marigold);}
.speed-select{border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-size:.85rem;color:var(--ink);background:#fff;min-height:48px;font-family:inherit;}
.nav-row{display:flex;gap:10px;margin-top:14px;}
.nav-btn{flex:1;padding:13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.92rem;cursor:pointer;min-height:48px;color:var(--ink);font-family:inherit;}
.nav-btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff;}
.nav-btn:disabled{opacity:.4;}

/* Practice */
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.q-progress{font-size:.8rem;color:#8a8373;}
.score-chip{font-size:.78rem;background:#dcefe3;color:var(--leaf);padding:4px 10px;border-radius:999px;font-weight:700;}
.q-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 20px;box-shadow:0 8px 24px rgba(44,58,107,.07);}
.q-prompt{font-size:.85rem;color:#8a8373;margin-top:8px;margin-bottom:4px;}
.hint-row{margin:14px 0;}
.hint-link{font-size:.85rem;color:var(--indigo);font-weight:700;cursor:pointer;background:var(--paper-deep);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;}
.hint-box{font-size:1rem;background:var(--paper-deep);border-radius:8px;padding:10px 12px;margin-top:8px;}
.q-word-row{display:flex;align-items:center;gap:10px;}
.choice-list{display:flex;flex-direction:column;gap:10px;}
.choice-row{display:flex;align-items:center;gap:8px;}
.choice-row .choice{flex:1;}
.choice-row .spk-inline{width:40px;height:40px;min-width:40px;min-height:40px;font-size:1rem;background:var(--marigold);flex-shrink:0;}
.choice-row .spk-inline:active{background:#b5751f;}
.choice{border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;background:#fff;text-align:left;font-size:1rem;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:10px;font-family:inherit;color:var(--ink);}
.choice .letter{width:26px;height:26px;border-radius:50%;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:#8a8373;flex-shrink:0;}
.choice.correct{background:#dcefe3;border-color:var(--leaf);}
.choice.correct .letter{background:var(--leaf);color:#fff;}
.choice.wrong{background:#f8dde1;border-color:var(--rose);}
.choice.wrong .letter{background:var(--rose);color:#fff;}
.choice:disabled{cursor:default;}
.feedback-banner{margin-top:16px;padding:14px;border-radius:10px;font-size:.98rem;font-weight:700;display:none;}
.feedback-banner.show{display:block;}
.feedback-banner.ok{background:#dcefe3;color:var(--leaf);}
.feedback-banner.no{background:#f8dde1;color:var(--rose);}
.continue-btn{width:100%;margin-top:12px;background:var(--indigo);color:#fff;border:none;border-radius:10px;padding:14px;font-weight:700;font-size:1rem;cursor:pointer;min-height:48px;display:none;font-family:inherit;}
.continue-btn.show{display:block;}

/* Exam */
.exam-wrap{background:var(--exam-paper);border:1px solid #e3dcc6;border-radius:4px;padding:22px 18px;background-image:radial-gradient(#e7e0cc 1px, transparent 1px);background-size:10px 10px;}
.exam-header{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px;}
.exam-header .board{font-size:.72rem;letter-spacing:.5px;color:#6b6456;}
.exam-header h2{font-family:'Lora',serif;font-size:1.15rem;margin-top:4px;}
.exam-header .sub{font-size:.78rem;color:#6b6456;margin-top:4px;}
.exam-q{margin-bottom:20px;}
.exam-q .qnum{font-weight:700;font-family:'Lora',serif;}
.exam-q .qtext{font-family:'Lora',serif;line-height:1.7;}
.bubble-row{display:flex;flex-direction:column;gap:4px;margin-top:10px;}
.bubble{display:flex;align-items:center;gap:10px;cursor:pointer;padding:9px 2px;min-height:44px;}
.bubble input{display:none;}
.bubble .ring{width:20px;height:20px;border-radius:50%;border:2px solid #6b6456;flex-shrink:0;position:relative;transition:transform .08s;}
.bubble input:checked + .ring{border-color:var(--indigo);}
.bubble input:checked + .ring::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--indigo);}
.bubble.clicked .ring{transform:scale(1.15);}
.bubble .opt-text{font-family:'Lora',serif;font-size:1rem;}
.exam-submit{width:100%;background:var(--indigo);color:#fff;border:none;border-radius:10px;padding:15px;font-weight:700;font-size:1rem;margin-top:10px;cursor:pointer;min-height:48px;font-family:inherit;}
.exam-result{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;}
.exam-result .big-score{font-family:'Lora',serif;font-size:2.4rem;color:var(--indigo-deep);margin:10px 0 2px;}
.exam-review{margin-top:16px;text-align:left;}
.exam-review .rline{padding:10px 0;border-top:1px solid var(--line);font-size:.92rem;}
.exam-review .rline.wrong{color:var(--rose);}
.exam-review .rline.right{color:var(--leaf);}

.empty-note{background:#fff8e8;border:1px solid var(--marigold-soft);border-radius:10px;padding:12px 14px;font-size:.85rem;color:#7a5a16;margin-bottom:14px;}
::-webkit-scrollbar{width:0;height:0;}
button{font-family:inherit;}
button:focus-visible, input:focus-visible, .bubble input:focus-visible + .ring{
  outline:3px solid var(--marigold);outline-offset:2px;border-radius:8px;
}
.kbd-hint{font-size:.72rem;color:#8a8373;background:var(--paper-deep);border-radius:5px;padding:2px 7px;margin-left:6px;font-weight:700;}
.subject-grid{display:flex;flex-direction:column;gap:14px;margin-top:6vh;}
.subject-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:26px 20px;text-align:left;cursor:pointer;min-height:48px;font-family:inherit;box-shadow:0 8px 24px rgba(44,58,107,.07);}
.subject-card h2{font-family:'Lora',serif;font-size:1.3rem;color:var(--indigo-deep);}
.subject-card p{color:#8a8373;font-size:.88rem;margin-top:4px;}
.subject-card .tamil{font-size:.95rem;color:#6b6456;margin-top:2px;}
.progress-summary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.progress-summary .big{font-family:'Lora',serif;font-size:1.3rem;color:var(--indigo-deep);font-weight:700;}
.progress-summary .lbl{font-size:.78rem;color:#8a8373;}
.review-cta{background:var(--marigold-soft);border:1px solid var(--marigold);border-radius:12px;padding:13px 15px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.review-cta .txt{font-size:.88rem;color:#7a5a16;font-weight:700;}
.review-cta button{background:var(--marigold);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:.8rem;font-weight:700;cursor:pointer;min-height:40px;}
.empty-subject{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 22px;text-align:center;margin-top:4vh;}
.empty-subject p{color:#6b6456;margin-top:8px;line-height:1.6;}

/* About screen */
.about-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 22px;margin-top:3vh;}
.about-card h1{font-size:1.3rem;color:var(--indigo-deep);line-height:1.4;}
.about-card .tagline{color:#8a8373;font-size:.88rem;margin-top:4px;}
.about-section{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
.about-section .about-lbl{font-size:.72rem;letter-spacing:.5px;text-transform:uppercase;color:#8a8373;font-weight:700;margin-bottom:8px;}
.credit-block{background:var(--paper-deep);border-radius:12px;padding:16px 16px;}
.credit-block .cname{font-family:'Lora',serif;font-weight:700;font-size:1.05rem;color:var(--indigo-deep);}
.credit-block .crole{font-size:.88rem;color:var(--ink);margin-top:3px;}
.credit-block .cschool{font-size:.86rem;color:#6b6456;margin-top:2px;line-height:1.5;}
.about-section p.source-txt{font-size:.9rem;color:var(--ink);line-height:1.6;}
.about-section p.disclaimer{font-size:.8rem;color:#8a8373;line-height:1.6;margin-top:6px;}
@media (prefers-reduced-motion:reduce){.screen{animation:none;}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------------- DATA ---------------- */
// Each word has its own hand-written sentence that actually demonstrates the meaning in context —
// these are original sentences written for this app, not reproduced from the copyrighted textbook.
const LESSONS = [
  { id:1, title:"His First Flight", words:[
    {w:"Beckoning",m:"To call",s:"His mother stood on a distant rock, beckoning him to jump and fly."},
    {w:"Cackle",m:"Sharp noise",s:"The other birds began to cackle loudly when they saw him standing still."},
    {w:"Devour",m:"To eat",s:"The hungry young seagull wanted to devour the fish his father was holding."},
    {w:"Preening",m:"Cleaning",s:"He spent the whole morning preening his feathers instead of trying to fly."},
    {w:"Shrilly",m:"High pitched sound",s:"The young bird cried shrilly, afraid to leave the safety of the rocky ledge."},
    {w:"Swoop",m:"Move quickly",s:"His sister watched her brother swoop down gracefully toward the sea."},
    {w:"Trot",m:"Jog",s:"Instead of flying, he could only trot nervously along the narrow ledge."},
    {w:"Cowardice",m:"Lack of bravery",s:"His family began to question his cowardice when he refused to jump."},
    {w:"Whet",m:"Sharpen",s:"The smell of fresh fish was enough to whet his appetite for food."}
  ]},
  { id:2, title:"The Night the Ghost Got In", words:[
    {w:"Attic",m:"Space / room / loft",s:"Strange footsteps seemed to come from the attic above their heads."},
    {w:"Gruffly",m:"Sadly",s:"Father answered the question gruffly, clearly annoyed at being woken up at midnight."},
    {w:"Intuitively",m:"Instinctively",s:"Without being told anything, the dog intuitively sensed that something was wrong."},
    {w:"Whammed",m:"Forcefully struck",s:"The door whammed shut on its own, startling everyone in the house."},
    {w:"Rapidly",m:"Quickly",s:"Mother came down the stairs rapidly the moment she heard the strange noise."},
    {w:"Reluctant",m:"Unwilling",s:"The boys were reluctant to go back upstairs alone in the dark."}
  ]},
  { id:3, title:"Empowered Women Navigating the World", words:[
    {w:"Anticipate",m:"Foresee",s:"Experienced sailors anticipate rough weather long before the storm actually arrives."},
    {w:"Skippered",m:"Master / Captain",s:"She skippered the small boat across the ocean with great confidence."},
    {w:"Expedition",m:"Journey / Voyage",s:"The all-women crew prepared carefully for their long sea expedition."},
    {w:"Replenishment",m:"Restoration",s:"They stopped at a small island for replenishment of food and fresh water."},
    {w:"Apprehensive",m:"Anxious",s:"Even the bravest sailors felt apprehensive before entering unknown waters."},
    {w:"Contention",m:"Strenuous effort",s:"Every record set at sea is the result of years of contention and hard training."},
    {w:"Auxiliary",m:"Extra / Additional",s:"They carried an auxiliary engine on board in case the main one failed."},
    {w:"Morale",m:"Confidence",s:"Her calm leadership kept the whole team's morale high during the storm."}
  ]},
  { id:4, title:"The Attic", words:[
    {w:"Soothing",m:"Pleasing / Pacifying",s:"The old lullaby had a soothing effect on the frightened child."},
    {w:"Smacks",m:"Drive / put forcefully",s:"The sudden wind smacks the old attic door shut every single evening."},
    {w:"Unperturbed",m:"Undisturbed",s:"He remained unperturbed even when the old wooden ladder began to shake."},
    {w:"Crumbled",m:"Broken",s:"The ancient letters crumbled the moment she tried to unfold them."},
    {w:"Ascertained",m:"Confirmed",s:"It was later ascertained that the dusty trunk had belonged to their grandfather."},
    {w:"Antique",m:"Ancient",s:"They found a beautiful antique clock hidden under a pile of old clothes."},
    {w:"Essential",m:"Necessary / Important",s:"A torch is essential if you want to explore a dark attic safely."}
  ]},
  { id:5, title:"Tech Bloomers", words:[
    {w:"Grapple",m:"Wrestle / Fight",s:"Young engineers often grapple with difficult problems before finding a solution."},
    {w:"Gaze",m:"Stare",s:"Visitors would gaze at the glowing computer screens in complete amazement."},
    {w:"Inclusion",m:"Co-operation",s:"The company is well known for its inclusion of women in leadership roles."},
    {w:"Cloister",m:"Enclosed",s:"She refused to cloister herself away and instead shared her ideas with the world."},
    {w:"Prolific",m:"Productive",s:"She became a prolific inventor, filing dozens of patents during her lifetime."},

/* ---------------- TTS ENGINE ---------------- */
let speechSessionId = 0;
let voicesCache = [];
let audioSupported = ('speechSynthesis' in window);
function loadVoices(){ voicesCache = speechSynthesis.getVoices(); }
if(audioSupported){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  const inVoice = voicesCache.find(v=>v.lang==='en-IN');
  if(inVoice) return inVoice;
  return voicesCache.find(v=>v.lang && v.lang.startsWith('en')) || null;
}
function cancelSpeech(){
  speechSessionId++;
  if(audioSupported) speechSynthesis.cancel();
  document.querySelectorAll('.tok.speaking').forEach(el=>el.classList.remove('speaking'));
}
function speakWord(word){
  if(!audioSupported) return showAudioWarning();
  cancelSpeech();
  const u = new SpeechSynthesisUtterance(word);
  const v = pickVoice(); if(v) u.voice = v;
  u.rate = Math.max(0.7, state.speechRate - 0.15); // a touch slower for isolated word
  u.lang = v ? v.lang : 'en-US';
  speechSynthesis.speak(u);
}
// Plain read-aloud for short phrases (used for MCQ answer choices) — no word-highlight tracking needed.
function speakPlain(text){
  if(!audioSupported) return showAudioWarning();
  cancelSpeech();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if(v) u.voice = v;
  u.rate = state.speechRate;
  u.lang = v ? v.lang : 'en-US';
  speechSynthesis.speak(u);
}
// Speaks the full sentence as one natural utterance and highlights each word as it's spoken,
// using the browser's word-boundary events. Falls back to highlighting the whole sentence
// if the browser/voice doesn't fire boundary events (e.g. some Safari/webview builds).
function speakSentenceWithHighlight(container, plainText){
  if(!audioSupported) return showAudioWarning();
  cancelSpeech();
  const mySession = speechSessionId;
  const toks = Array.from(container.querySelectorAll('.tok'));
  let gotBoundary = false;
  const u = new SpeechSynthesisUtterance(plainText);
  const v = pickVoice(); if(v) u.voice = v;
  u.rate = state.speechRate;
  u.lang = v ? v.lang : 'en-US';
  u.onboundary = (ev)=>{
    if(mySession !== speechSessionId) return;
    if(ev.name && ev.name !== 'word') return;
    gotBoundary = true;
    const idx = ev.charIndex;
    toks.forEach(t=>t.classList.remove('speaking'));
    let match = null;
    for(const t of toks){
      const s = parseInt(t.dataset.start,10), e = parseInt(t.dataset.end,10);
      if(idx>=s && idx<e){ match=t; break; }
    }
    if(!match){
      for(const t of toks){ if(parseInt(t.dataset.start,10) >= idx){ match=t; break; } }
    }
    if(match) match.classList.add('speaking');
  };
  u.onend = ()=>{ if(mySession===speechSessionId) toks.forEach(t=>t.classList.remove('speaking')); };
  u.onerror = ()=>{ if(mySession===speechSessionId) toks.forEach(t=>t.classList.remove('speaking')); };
  speechSynthesis.speak(u);
  setTimeout(()=>{
    if(mySession===speechSessionId && !gotBoundary){
      toks.forEach(t=>t.classList.add('speaking')); // fallback: highlight whole sentence together
    }
  }, 700);
}
function showAudioWarning(){
  const w = document.getElementById('audioWarn');
  if(w) w.classList.add('show');
}
// Builds tokenized spans with character offsets for boundary-matching, and marks the target word.
function tokenizeSentence(sentence, targetWord){
  const re = /(\s+)/;
  const parts = sentence.split(re);
  let offset = 0;
  let html = '';
  parts.forEach(part=>{
    const start = offset;
    offset += part.length;
    if(!part.trim()){ html += part; return; }
    const bare = part.replace(/[.,!?;:"]/g,'');
    const isTarget = bare.toLowerCase() === targetWord.toLowerCase();
    html += `<span class="tok${isTarget?' target':''}" data-start="${start}" data-end="${offset}">${part}</span>`;
  });
  return html;
}

/* ---------------- SOUND FEEDBACK (Web Audio, no external files) ---------------- */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx = null; } }
  return audioCtx;
}
function playTone(freq, startTime, dur, type, gain){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type||'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, ctx.currentTime+startTime);
  g.gain.linearRampToValueAtTime(gain||0.18, ctx.currentTime+startTime+0.02);
  g.gain.linearRampToValueAtTime(0, ctx.currentTime+startTime+dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(ctx.currentTime+startTime);
  osc.stop(ctx.currentTime+startTime+dur+0.02);
}
function playCorrectSound(){
  if(!prefs.sound) return;
  playTone(659.25, 0, 0.14, 'sine', 0.16);
  playTone(880, 0.12, 0.2, 'sine', 0.16);
}
function playWrongSound(){
  if(!prefs.sound) return;
  playTone(220, 0, 0.22, 'sawtooth', 0.09);
}
function playResultSound(pct){
  if(!prefs.sound) return;
  if(pct>=70){ playTone(523.25,0,0.14,'sine',0.15); playTone(659.25,0.13,0.14,'sine',0.15); playTone(783.99,0.26,0.25,'sine',0.15); }
  else { playTone(440,0,0.18,'sine',0.13); playTone(392,0.16,0.3,'sine',0.13); }
}

/* ---------------- PRACTICE MODE ---------------- */
function allMeaningsPool(excludeWord){
  const pool = [];
  lessonsFor(state.subject).forEach(l=>l.words.forEach(w=>{ if(w.w!==excludeWord) pool.push(w.m); }));
  return pool;
}
function buildPracticeQueue(){
  const lesson = currentLesson();
  state.practiceQueue = lesson.words.map((w,idx)=>({...w, idx}));
  state.qIdx=0; state.score=0; state.missed=[];
  nextQuestion();
}
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function nextQuestion(){
  if(state.qIdx >= state.practiceQueue.length) return;
  const q = state.practiceQueue[state.qIdx];
  const pool = shuffle(allMeaningsPool(q.w)).slice(0,3);
  state.currentChoices = shuffle([q.m, ...pool]);
  state.answered = false;
}
function renderPractice(body, lesson){
  const wrap = document.createElement('div');
  wrap.className='screen';
  if(state.qIdx >= state.practiceQueue.length){
    const pct = Math.round((state.score/state.practiceQueue.length)*100);
    setProgress(state.subject, lesson.id, {practiceDone:true, lastScore:pct});
    playResultSound(pct);
    // Persist missed words across visits: drop any word from this round that's now answered
    // correctly, keep/add any still missed — so the review queue only ever holds true gaps.
    const existing = getMissed(state.subject, lesson.id);
    const roundWords = state.practiceQueue.map(q=>q.w);
    const filtered = existing.filter(x => !roundWords.includes(x.w) || state.missed.find(m=>m.w===x.w));
    state.missed.forEach(m=>{ if(!filtered.find(x=>x.w===m.w)) filtered.push({w:m.w,m:m.m}); });
    setMissed(state.subject, lesson.id, filtered);
    wrap.innerHTML = `
      <div class="q-card" style="text-align:center;">
        <h2 class="serif">Practice Complete!</h2>
        <div class="exam-result"><div class="big-score">${state.score}/${state.practiceQueue.length}</div><p>You scored ${pct}%</p></div>
        ${state.missed.length ? `

      </div>
    `;
    body.innerHTML=''; body.appendChild(wrap);
    const retry = wrap.querySelector('#retryBtn');
    if(retry) retry.onclick = ()=>{
      state.practiceQueue = state.missed.map((w,idx)=>({...w, idx}));
      state.qIdx=0; state.score=0; state.missed=[]; nextQuestion(); renderPractice(body, lesson);
    };
    const examBtn = wrap.querySelector('#examBtn');
    if(examBtn) examBtn.onclick = ()=>{ state.mode='exam'; buildExamQuestions(); renderLessonHub(); };
    return;
  }

  const q = state.practiceQueue[state.qIdx];
  const letters = ['A','B','C','D'];
  wrap.innerHTML = `
    <div class="q-head">
      <span class="q-progress">Question ${state.qIdx+1} of ${state.practiceQueue.length}</span>

      <div class="feedback-banner" id="feedback"></div>
      <button class="continue-btn" id="continueBtn">Continue &#8594;</button>
    </div>
  `;
  body.innerHTML=''; body.appendChild(wrap);
  wrap.querySelector('#qWordBtn').onclick = ()=>{ speakWord(q.w); };

  const list = wrap.querySelector('#choiceList');
  state.currentChoices.forEach((c,ci)=>{
    const row = document.createElement('div');
    row.className='choice-row';
    const btn = document.createElement('button');
    btn.className='choice';
    btn.innerHTML = `<span class="letter">${letters[ci]}</span><span style="flex:1;">${escapeHtml(c)}</span><span class="kbd-hint">${ci+1}</span>`;
    const spk = document.createElement('button');
    spk.className='spk-inline choice-spk';
    spk.setAttribute('aria-label','Hear this answer');
    spk.innerHTML='&#128266;';
    spk.onclick = (ev)=>{ ev.stopPropagation(); speakPlain(c); };
    row.appendChild(btn); row.appendChild(spk);
    btn.onclick = ()=>{
      if(state.answered) return;
      state.answered = true;
      const correct = c === q.m;
      btn.classList.add(correct?'correct':'wrong');
      if(correct){ state.score++; playCorrectSound(); } else {
        playWrongSound();
        state.missed.push(q);
        list.querySelectorAll('.choice').forEach(b=>{ if(b.textContent.trim()===q.m) b.classList.add('correct'); });
      }
      list.querySelectorAll('.choice').forEach(b=>b.disabled=true);
      const fb = wrap.querySelector('#feedback');
      fb.classList.add('show', correct?'ok':'no');
      fb.textContent = correct ? 'Correct! Well done.' : `Not quite — the correct meaning is "${q.m}".`;
      wrap.querySelector('#continueBtn').classList.add('show');
    };
    list.appendChild(row);
  });

  wrap.querySelector('#hintBtn').onclick = ()=>{ wrap.querySelector('#hintBox').style.display='block'; };
  wrap.querySelector('#continueBtn').onclick = ()=>{
    state.qIdx++; nextQuestion(); renderPractice(body, lesson);
  };
}

/* ---------------- EXAM MODE ---------------- */
function buildExamQuestions(){
  const lesson = currentLesson();
  state.examQuestions = lesson.words.map(q=>{
    const pool = shuffle(allMeaningsPool(q.w)).slice(0,3);
    return { w:q.w, m:q.m, choices: shuffle([q.m, ...pool]) };
  });
  state.examAnswers = {}; state.examSubmitted = false;
}
function renderExam(body, lesson){
  const wrap = document.createElement('div');
  wrap.className='screen';
  if(state.examSubmitted){
    let score=0;
    const lines = state.examQuestions.map((q,idx)=>{
      const given = state.examAnswers[idx];
      const right = given===q.m;
      if(right) score++;
      return `<div class="rline ${right?'right':'wrong'}">Q${idx+1}. ${escapeHtml(q.w)} — your answer: ${given?escapeHtml(given):'(blank)'} ${right?'&#10003;':('&#10007; (correct: '+escapeHtml(q.m)+')')}</div>`;
    }).join('');
    wrap.innerHTML = `
      <div class="exam-result">
        <p class="serif" style="color:#6b6456;">Your result</p>
        <div class="big-score">${score} / ${state.examQuestions.length}</div>
        <div class="exam-review">${lines}</div>
        <button class="nav-btn primary" id="redoBtn" style="width:100%;margin-top:16px;">Do another paper</button>
      </div>
    `;
    body.innerHTML=''; body.appendChild(wrap);
    wrap.querySelector('#redoBtn').onclick = ()=>{ buildExamQuestions(); renderExam(body, lesson); };
    return;
  }
  const qHtml = state.examQuestions.map((q,idx)=>{
    const letters=['(a)','(b)','(c)','(d)'];
    return `
      <div class="exam-q">
        <span class="qnum">${idx+1}.</span>
        <span class="qtext">${state.subject==='antonyms' ? 'Choose the word opposite in meaning to' : 'Choose the word nearest in meaning to'} <b><u>${escapeHtml(q.w)}</u></b>:</span>
        <div class="bubble-row">
          ${q.choices.map((c,ci)=>`
            <label class="bubble" data-q="${idx}" data-v="${escapeHtml(c)}">
              <input type="radio" name="q${idx}" value="${escapeHtml(c)}">
              <span class="ring"></span>
              <span class="opt-text">${letters[ci]} ${escapeHtml(c)}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
  wrap.innerHTML = `
    <div class="exam-wrap">
      <div class="exam-header">
        <div class="board">TAMIL NADU STATE BOARD — CLASS 10 ENGLISH EXAMINATION (PRACTICE)</div>
        <h2>English — Part I, Section A: ${state.subject==='antonyms'?'Antonyms':'Synonyms'}</h2>
        <div class="sub">${lesson.isExam?'Public Exam Words':'Lesson '+lesson.id+' — '+escapeHtml(lesson.title)} &nbsp;|&nbsp; ${state.examQuestions.length} Marks</div>
      </div>
      ${qHtml}
      <button class="exam-submit" id="submitExam">Submit Paper</button>
    </div>
  `;
  body.innerHTML=''; body.appendChild(wrap);
  wrap.querySelectorAll('.bubble').forEach(lbl=>{
    lbl.onclick = ()=>{
      const q = lbl.dataset.q, v = lbl.dataset.v;
      state.examAnswers[q] = v;
      lbl.classList.add('clicked'); setTimeout(()=>lbl.classList.remove('clicked'), 150);
      wrap.querySelectorAll(`.bubble[data-q="${q}"] input`).forEach(inp=>{ inp.checked = inp.value===v; });
    };
  });
  wrap.querySelector('#submitExam').onclick = ()=>{ state.examSubmitted = true; renderExam(body, lesson); };
}

render();
</script>
