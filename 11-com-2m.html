        a: "பொருட்களின் விற்பனையாளரால் நுகர்வோரிடமிருந்து வசூலிக்கப்பட்டு அரசுக்குச் செலுத்தப்படும் வரி மறைமுக வரி ஆகும் (எ.கா: GST)."
      },
      {
        q: "இந்தியாவில் உள்ள மறைமுக வரிகளுக்கு இரண்டு உதாரணம் தருக.",
        a: "சரக்கு மற்றும் சேவை வரி (GST) மற்றும் சுங்க வரி (Customs Duty)."
      }
    ]
  }
];

let lessonIdx = 0;
let itemIdx = 0;
let synth = window.speechSynthesis;
let availableVoices = [];
let activePlayingTarget = null;
let isAnswerRevealed = false;

const audioPlayer = document.getElementById("remoteAudioPlayer");
const lessonSelect = document.getElementById("lessonSelect");
const qText = document.getElementById("qText");
const aText = document.getElementById("aText");
const counterBadge = document.getElementById("counterBadge");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const speedSelect = document.getElementById("speedSelect");

const answerSection = document.getElementById("answerSection");
const btnReveal = document.getElementById("btnReveal");
const labelReveal = document.getElementById("labelReveal");

const btnAudioQ = document.getElementById("btnAudioQ");
const labelAudioQ = document.getElementById("labelAudioQ");
const btnAudioA = document.getElementById("btnAudioA");
const labelAudioA = document.getElementById("labelAudioA");

function loadVoices() {
  if (synth) {
    availableVoices = synth.getVoices();
  }
}
loadVoices();
if (synth && synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = loadVoices;
}

data.forEach((l, idx) => {
  const opt = document.createElement("option");
  opt.value = idx;
  opt.textContent = l.lesson;
  lessonSelect.appendChild(opt);
});

lessonSelect.addEventListener("change", (e) => {
  lessonIdx = parseInt(e.target.value);
  itemIdx = 0;
  stopSpeech();
  hideAnswer();
  renderCard();
});

function renderCard() {
  const lesson = data[lessonIdx];
  const item = lesson.items[itemIdx];

  qText.textContent = item.q;
  aText.textContent = item.a;

  counterBadge.textContent = `கேள்வி ${itemIdx + 1} / ${lesson.items.length}`;
  prevBtn.disabled = itemIdx === 0;
  nextBtn.disabled = itemIdx === lesson.items.length - 1;
}

function stopSpeech() {
  if (synth && synth.speaking) {
    synth.cancel();
  }
  if (!audioPlayer.paused) {
    audioPlayer.pause();
    audioPlayer.currentTime = 0;
  }
  resetAudioButtons();
  activePlayingTarget = null;
}

function resetAudioButtons() {
  btnAudioQ.classList.remove("playing");
  labelAudioQ.textContent = "கேள்வியை வாசி";
  btnAudioA.classList.remove("playing");
  labelAudioA.textContent = "பதிலை வாசி";
}

function hasLocalVoice(lang) {
  const langPrefix = lang.split("-")[0].toLowerCase();
  return availableVoices.some(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix));
}

function toggleAudio(target) {
  if (activePlayingTarget === target) {
    stopSpeech();
    return;
  }

  stopSpeech();
  activePlayingTarget = target;

  const lesson = data[lessonIdx];
  const item = lesson.items[itemIdx];
  const text = target === "q" ? item.q : item.a;
  const btn = target === "q" ? btnAudioQ : btnAudioA;
  const label = target === "q" ? labelAudioQ : labelAudioA;

  btn.classList.add("playing");
  label.textContent = "நிறுத்து";

  const rate = parseFloat(speedSelect.value);

  if (synth && hasLocalVoice(lesson.lang)) {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lesson.lang;
    utter.rate = rate;

    const matchedVoice = availableVoices.find(v => v.lang && v.lang.toLowerCase().startsWith(lesson.lang.split("-")[0]));
    if (matchedVoice) utter.voice = matchedVoice;

    utter.onend = () => {
      resetAudioButtons();
      activePlayingTarget = null;
    };
    utter.onerror = () => {
      playRemoteFallback(text, lesson.lang);
    };

    synth.speak(utter);
  } else {
    playRemoteFallback(text, lesson.lang);
  }
}

function playRemoteFallback(text, lang) {
  const langCode = lang.split("-")[0];
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${langCode}&client=tw-ob`;

  audioPlayer.src = url;
  audioPlayer.playbackRate = parseFloat(speedSelect.value);
  audioPlayer.play().catch(() => {
    resetAudioButtons();
    activePlayingTarget = null;
  });

  audioPlayer.onended = () => {
    resetAudioButtons();
    activePlayingTarget = null;
  };
  audioPlayer.onerror = () => {
    resetAudioButtons();
    activePlayingTarget = null;
  };
}

function toggleRevealAnswer() {
  if (isAnswerRevealed) {
    hideAnswer();
  } else {
    showAnswer();
  }
}

function showAnswer() {
  answerSection.classList.add("show");
  labelReveal.textContent = "பதிலை மறை";
  isAnswerRevealed = true;
}

function hideAnswer() {
  answerSection.classList.remove("show");
  labelReveal.textContent = "பதிலைக் காட்டு";
  isAnswerRevealed = false;
  if (activePlayingTarget === "a") {
    stopSpeech();
  }
}

function navigate(dir) {
  stopSpeech();
  hideAnswer();
  itemIdx += dir;
  renderCard();
}

renderCard();
</script>
</body>
</html>
